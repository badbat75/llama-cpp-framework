; The framework's standard benchmark method, version 1.0.
;
; Installed beside the binaries (share/benchmarks/specs/standard-1.0.ini; the
; repo's benchmarks/specs/ for a tree build) with every other published
; version: `llama-cpp-config bench sweep --spec standard` runs the newest,
; `--spec standard-1.0` this one. Every run records Name, Version and the
; digest of the rules, so `bench query summary --param spec-version=1.0`
; compares like with like. The binary carries only standard.versions, the
; digest of each version: this file edited in place no longer matches its line
; and runs as custom. A changed rule is a new file, standard-<X.Y>.ini, and a
; new line (a test enforces both). Procedure: .agents/skills/bench-spec/SKILL.md.
;
; Prompts (share/benchmarks/prompts/, each pinned by the sha256 of its text: a
; changed prompt is refused until a new version pins a new file):
;   bench-prompt-43k-1.0.txt    technical prose, 43.7k tokens on Qwen3.8
;   bench-prompt-110k-1.0.txt   the same kind of prose, 110k tokens
;   bench-prompt-code-1.0.json  a coding-agent turn, ~42k tokens: tool
;                               definitions, earlier tool calls and the source
;                               files they read, then the model's next step
; Output is uncapped (MaxTokens = 0): how long the model talks under a setting
; is part of the result.

[Spec]
Name = standard
Version = 1.0
Prompts = bench-prompt-43k-1.0.txt@96d8fb4f7d56d59ee53aa145394c8f8adb0122adbe16421391dcfd5576aaaae6, bench-prompt-110k-1.0.txt@2623e49a2cf2f67ffa4097d0f627c93f6aa71f3e8b5d37bd75a40ae0fb1e1b3c, bench-prompt-code-1.0.json@b3d23cadf1d89d903c90421055e5974b8eb298937518b23fe8c1d2744ba3f39c
MaxTokens = 0

; The bare engine: greedy sampling with the speculator OFF. Greedy text is what
; a drafter predicts best, so a temp-0 run with it on reads far faster than the
; preset ever serves. Without it the output is deterministic and only speed
; differs between legs: the baseline for placement, KV type, ubatch, threads.
[Pass.engine]
Temp = 0
Override = spec-type=none
Concurrency = single
Reps = 3

; Real use: the preset's own sampling and speculator, so acceptance is what
; it serves. Every repetition writes a different text: five, compare means.
; `all` adds every concurrent scenario at N = the preset's parallel.
[Pass.real]
Temp = preset
Concurrency = all
Reps = 5
