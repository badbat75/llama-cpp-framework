; The framework's standard benchmark method, version 1.1.
;
; Installed beside the binaries (share/benchmarks/specs/standard-1.1.ini; the
; repo's benchmarks/specs/ for a tree build) with every other published
; version: `llama-cpp-config bench run --spec standard` runs the newest,
; `--spec standard-1.1` this one. Every run records Name, Version and the
; digest of the rules, so `bench query summary --param spec-version=1.1`
; compares like with like. The binary carries only standard.versions, the
; digest of each version: this file edited in place no longer matches its line
; and runs as custom. A changed rule is a new file, standard-<X.Y>.ini, and a
; new line (a test enforces both). Procedure: .agents/skills/bench-spec/SKILL.md.
;
; Prompts (share/benchmarks/prompts/, each pinned by the sha256 of its text: a
; changed prompt is refused until a new version pins a new file):
;   bench-prompt-43k-1.0.txt    technical prose
;   bench-prompt-110k-1.0.txt   the same kind of prose, longer
;   bench-prompt-code-write-1.1.json
;                               writing code: the same task and
;                               files as the agent turn below, pasted into one
;                               user message, and a request to write one
;                               source file back in full (reasoning, then
;                               the code, much of it copied)
;   bench-prompt-image-1.0.json image to text: one photograph
;                               (bench-image-zebras-1.0.jpg, 6000x4000, pinned
;                               by its sha256 inside the prompt) and a request
;                               to describe it; run only on a preset that loads
;                               an mmproj, skipped on the rest
;   bench-prompt-code-1.0.json  a coding-agent turn: tool
;                               definitions, earlier tool calls and the source
;                               files they read, then the model's next step;
;                               run only by the agent pass, as a step whose
;                               prefix is already cached
; Output is uncapped (MaxTokens = 0): how long the model talks under a setting
; is part of the result. ImageSize: an image prompt's image is fitted into
; 1344x896 (aspect kept, never enlarged; Lanczos3, JPEG quality 90) when it is
; sent, so every model reads the same picture.

[Spec]
Name = standard
Version = 1.1
Prompts = bench-prompt-43k-1.0.txt@96d8fb4f7d56d59ee53aa145394c8f8adb0122adbe16421391dcfd5576aaaae6, bench-prompt-110k-1.0.txt@2623e49a2cf2f67ffa4097d0f627c93f6aa71f3e8b5d37bd75a40ae0fb1e1b3c, bench-prompt-code-write-1.1.json@ff3bf709f7d450ef35624957a897f25a1d514d49af036bdf4c38a50ca543d09a, bench-prompt-image-1.0.json@54bf9fe2d0d1cc971aa25ac8fa8194c34c470d4114b8bd6598988bad0ab1da37, bench-prompt-code-1.0.json@b3d23cadf1d89d903c90421055e5974b8eb298937518b23fe8c1d2744ba3f39c
MaxTokens = 0
ImageSize = 1344x896

; The bare engine: greedy sampling with the speculator OFF. Greedy text is what
; a drafter predicts best, so a temp-0 run with it on reads far faster than the
; preset ever serves. Without it the output is deterministic and only speed
; differs between legs: the baseline for placement, KV type, ubatch, threads.
[Pass.engine]
Prompts = bench-prompt-43k-1.0.txt, bench-prompt-110k-1.0.txt, bench-prompt-code-write-1.1.json, bench-prompt-image-1.0.json
Temp = 0
Override = spec-type=none
Concurrency = single
Reps = 3

; Real use: the preset's own sampling and speculator, so acceptance is what
; it serves. Every repetition writes a different text: five, compare means.
; `all` adds every concurrent scenario at N = the preset's parallel.
[Pass.real]
Prompts = bench-prompt-43k-1.0.txt, bench-prompt-110k-1.0.txt, bench-prompt-code-write-1.1.json, bench-prompt-image-1.0.json
Temp = preset
Concurrency = all
Reps = 5

; An agent's step: the slot primed with the conversation up to its last
; assistant turn, then the whole turn sent with the cache on, so the prefill is
; only what that turn added (a tool call and its result), as in a coding
; agent's loop; primed again before every repetition. It reports the time to
; the first token and the turn's wall time beside the rates. `all` runs single,
; decode (every slot takes a step at once) and prefill+decode (a step while
; another conversation prefills cold); prefill has no warm slot and is left out.
[Pass.agent]
Prompts = bench-prompt-code-1.0.json
Temp = preset
Warm = prefix
Concurrency = all
Reps = 5
