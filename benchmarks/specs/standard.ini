; The framework's standard benchmark method, version 1.
;
; Compiled into llama-cpp-config: run it with `llama-cpp-config bench sweep
; --spec standard --preset <id> --key <key> --values <a,b>`. Every run records
; Name, Version and the digest of the rules, so `bench query summary --param
; spec-version=1` compares like with like. Change a rule = bump Version and add
; its line to standard.versions (a test enforces it): a run of version 1 and
; one of version 2 are two methods, not two measurements of one. Procedure:
; .agents/skills/bench-spec/SKILL.md.
;
; Prompts: the shipped 43.7k and 110k-token prompts (seeded into the config
; directory on first use), each pinned by the sha256 of its text: the prompts
; are part of the method, so a changed prompt is refused until a new Version
; pins its digest. Output is uncapped (MaxTokens = 0): how long the model talks
; under a setting is part of the result.

[Spec]
Name = standard
Version = 1
Prompts = bench-prompt-43k.txt@96d8fb4f7d56d59ee53aa145394c8f8adb0122adbe16421391dcfd5576aaaae6, bench-prompt-110k.txt@2623e49a2cf2f67ffa4097d0f627c93f6aa71f3e8b5d37bd75a40ae0fb1e1b3c
MaxTokens = 0

; The bare engine: greedy sampling with the speculator OFF. Greedy text is what
; a drafter predicts best, so a temp-0 run with it on reads far faster than the
; preset ever serves. Without it the output is deterministic and only speed
; differs between legs: the baseline for placement, KV type, ubatch, threads.
[Pass.engine]
Temp = 0
Override = spec-type=none
Concurrency = single
Reps = 3

; Real use: the preset's own sampling and speculator, so acceptance is what
; it serves. Every repetition writes a different text: five, compare means.
; `all` adds every concurrent scenario at N = the preset's parallel.
[Pass.real]
Temp = preset
Concurrency = all
Reps = 5
