# The cargo workspace: the configurator (pai-config), its logic without a GUI
# (pai-app), the service manager (pai-manager), the library they share
# (pai-core), the build orchestrator (xtask, run as
# `cargo run -p xtask -- <phase>`) and the docs site generator (tools/site,
# `cargo run -p docs-site`). xtask drives llama.cpp's CMake build
# and this workspace's cargo build side by side; xtask, docs-site and the
# framework crates do not depend on each other, and CI builds docs-site
# alone. Profiles live here because cargo only reads them from the workspace
# root.
[workspace]
members = ["crates/core", "crates/app", "crates/manager", "crates/config", "crates/cli", "crates/bff", "xtask", "tools/site"]
resolver = "2"

# The framework version, one for its crates (pai-core, pai-app, pai-manager,
# pai-config: `version.workspace = true`); xtask names the packages after it
# (`version::framework`).
[workspace.package]
version = "2.4.0"

# Incremental compilation is OFF on purpose: Cargo garbage-collects the sessions
# *inside* target\debug\incremental\<crate>-<hash>\ but never removes an obsolete
# <hash> directory, and that hash changes on every version bump, Cargo.lock
# change and rustc upgrade. With a release-per-week cadence that fills the disk
# with dead directories. Cost: a debug `cargo build`/`cargo test`
# recompiles this crate whole (dependencies stay cached in target\debug\deps\).
[profile.dev]
incremental = false

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"

# xtask runs in the dev profile (`cargo run -p xtask`), and hashing a
# multi-GiB download with an unoptimized sha2 takes minutes: only the hasher
# is optimized, the configurator's debug builds are unchanged.
[profile.dev.package.sha2]
opt-level = 3
