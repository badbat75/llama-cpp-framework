[package]
name = "llama-cpp-config"
version = "2.2.0"
edition = "2021"
build = "build.rs"
description = "GUI + CLI configurator for llama.cpp-framework"
license = "MIT"
publish = false

[[bin]]
name = "llama-cpp-config"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "accessibility", "unstable-winit-030", "system-tray"] }
clap = { version = "4.6", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
rfd = { version = "0.17", default-features = false }
if-addrs = "0.15"
# The Tensor placement picker reads which tensors a rule's regex matches
# (tensor_picker.rs). Already in the lock as a transitive dependency.
regex = "1.13"
# bench.db (bench/db.rs): the benchmark store, one schema shared with the
# repo's benchmarks/. `bundled` compiles SQLite in, so Windows needs no DLL.
rusqlite = { version = "0.41", features = ["bundled"] }

# rfd has no file-dialog backend without a feature on Linux, and its build
# script refuses to compile with none chosen. xdg-portal talks to the desktop
# portal over D-Bus, so it needs no GTK development packages (the gtk3
# alternative does); `wayland` is the other half of rfd's own default pair.
# Cargo unions features across tables, so this only ADDS to the line above on
# Linux and the Windows build is unchanged.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

# Every Win32 call the crate makes (registry, single instance, console, HW
# Monitor, process handles), with the signatures and constants Microsoft's
# metadata declares instead of hand-written ones. 0.61 is the version slint's
# winit already compiles, so it adds nothing to the build. Each module is a
# feature: a new call may need one more.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# Headless Slint backend for the UI regression tests (src/tests/ui_bindings.rs).
# Already in the tree as an optional dep of slint; pinned to the same version.
i-slint-backend-testing = "1.18"

[build-dependencies]
slint-build = "1.18"
ico = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
