moe-floor-load = ": for this model at least {0} MiB (Save refuses less). With the GPUs weighed by free VRAM, which of them end up caching is decided at load."
moe-floor-repack = ": for this model at least {0} MiB (Save refuses less). With no-host the CPU repacks the experts it has kernels for, and those layers leave the cache."
moe-floor-split-same = ": for this preset at least {0} MiB (Save refuses less)."
moe-floor-split = ": for this preset at least {0} MiB (Save refuses less), and {1} MiB before every group of layers caches; in between, the ones with the smaller share of the budget run uncached."
