# The configurator's user-visible text, in one language: the file's name.
# Read once at startup from <install>/share/strings/, or from here in a tree build,
# so a text changes by editing its value here, with no rebuild.
#
# The keys are identifiers, used as Strings.t("key") in ui/*.slint and strings::t("key") in src/, and name a role, not a text:
# lowercase words and hyphens, no number, size, version or file name, one key per distinct text.
# A key with no entry here shows on screen as itself; a test fails on a missing or an unused key.
# Only language lives here: numbers, units, acronyms (t/s, sd, GQA), paths and format examples stay
# in the code, and an acronym inside a text stays in English in every language.
# A value in a sentence is {0}, {1} (Strings.t1, t2, strings::fill), so a translation can put it anywhere.
# Every value is a one-line basic string: a line break is \n, a backslash \\, a quote \".

benchmark = "Benchmark"
benchmark-intro = "Measure one preset, or compare several. The unit is the preset, not the model file: two presets over the same .gguf are a legitimate comparison, and usually the interesting one."
engine = "Engine"
mode = "Mode"
mode-hint = "live: real requests to the RUNNING llama-server, with your prompt and a temperature override. Measures what the preset actually does, speculative drafter and chat template included.\nsynthetic: llama-bench over token counts. It takes no prompt and never samples, so it is perfectly reproducible, but it cannot load the preset's drafter and ignores the mmproj, the template and the reasoning flags.\nlive needs llama-server running; synthetic needs it stopped, and stops it for you."
presets = "Presets"
no-presets = "No presets found. Create one under the Models tab first."
workload = "Workload"
prompts = "Prompts"
prompts-hint = "The files sent as the request, each ticked one in turn: a .txt as a single user message, a .json as the conversation it holds (messages and tools, like a coding agent's request) (one step per prompt, into one campaign). Each is re-sent whole on every repetition with the prefix cache disabled, so each one is a cold prefill, which is what the prefill row measures.\nFive prompts ship, installed read-only beside the program (share/benchmarks/prompts) and pinned by the standard spec: bench-prompt-43k-1.0.txt (the default), bench-prompt-110k-1.0.txt (the longer one, for deep context), bench-prompt-code-1.0.json (a coding-agent turn with tools), bench-prompt-code-write-1.1.json (the same task, writing code) and bench-prompt-image-1.0.json (a photograph to describe; run only on presets with an mmproj, its picture shown and replaceable in the Image row); + adds a file of your own (a custom run, or with a spec a derived one). The ranking of a knob can differ with the context you actually work at, which is why the prose and coding prompts are long.\nRead fresh when Run starts, so editing one of yours while this window is open is enough: Edit opens it in your default editor (a shipped one is read-only: change a copy). The first ticked one is also what `bench run` reads with no --prompt-file."
edit = "Edit"
remove = "Remove"
add-file = "+ Browse…"
temperature = "Temperature"
temperature-hint = "Overrides the preset's own --temp for this run. 0 is greedy sampling, which is what makes two runs of the same prompt comparable; tick 'default' to leave the preset's value alone and accept the variance."
max-output-tokens = "Max output tokens"
max-output-tokens-hint = "Cap on the generated answer (--max_tokens on the request). Long enough that the decode rate settles, short enough that a slow model does not turn one repetition into minutes.\n0 = no cap: the request carries no max_tokens and the model stops on its own (or at the preset's n-predict), so how long it talks is part of the result."
image = "Image"
image-hint = "The picture an image prompt sends (a prompt whose message holds an image_file part, like the shipped bench-prompt-image-1.0.json). By default each image prompt sends its own, shown here for the first one ticked (with none ticked, the shipped bench-prompt-image-1.0.json's, the one the standard spec sends); Choose… sends a JPEG or PNG of yours in place of every image prompt's own, fitted into Image size like theirs. Under a spec that is an Override: the runs record spec = custom, derived from it, with image and image-sha256 naming the file. Prompt's goes back to the prompts' own.\nAn image prompt runs only on presets that load an mmproj."
choose = "Choose…"
use-prompt-image = "Prompt's"
image-size = "Image size"
image-size-hint = "An image prompt's image is fitted into this box when it is sent (WxH, aspect kept, never enlarged; re-encoded as JPEG), so every model reads the same picture whatever the file's size.\noriginal = the file as is.\nA prompt without an image ignores it, and an image prompt runs only on presets that load an mmproj."
concurrency = "Concurrency"
concurrency-hint = "single: one request per repetition.\nThe others send one request per slot of the preset AT ONCE, N = the preset's parallel (absent = llama-server's auto 4; it must be at least 2), each pinned to its slot:\nprefill: all N prefill the whole prompt, then decode together.\ndecode: every slot is primed with the prompt first, so all N only decode.\nprefill+decode: N-1 primed slots decode while the last one prefills.\nThe table adds prefill total and decode total, the throughput of the N requests together.\nall: each of the four in turn, into one campaign (single alone when a selected preset has parallel below 2), as `bench run --concurrency all`."
prompt-lengths = "Prompt lengths"
prompt-lengths-hint = "llama-bench's -p: how many TOKENS to prefill, comma separated. Not a text: this engine never tokenizes a prompt of yours and never samples. One pp row per length."
generate = "Generate"
generate-hint = "llama-bench's -n: how many tokens to generate per decode test."
depths = "Depths"
depths-hint = "llama-bench's -d: how many tokens of KV cache to prefill before each decode test, comma separated. Decode slows down with context, so a single depth of 0 measures only the best case."
repetitions = "Repetitions"
repetitions-hint = "Samples per measurement. The results table reports the mean and the sample standard deviation across them, which is what says whether a difference between two presets is real."
campaign = "Campaign"
spec = "Spec"
spec-hint = "The method: custom runs the Workload fields above and records spec = custom; standard-<X.Y> runs that published version of the framework's method (installed with its prompts under share/benchmarks; every version stays runnable, each checked against its digest in standard.versions, built into this binary). Load… opens a spec file of yours and Save as… writes what the card describes as one (never the official one: the name standard is refused); a spec of yours runs like the official one but records every run as spec = custom, derived from it. A spec fixes the prompts, temperature, output cap, concurrency and repetitions, so those fields are greyed out; it records spec, spec-version, spec-sha256 and spec-pass with every run, which is what makes runs of two machines comparable. Live only. A pass that overrides a preset key (the engine pass sets spec-type = none) writes it to the selected presets for its steps, restarting llama-server around them, and puts it back."
load = "Load…"
save-as = "Save as…"
spec-override-hint = "Re-enables the Workload fields. Each one you change after ticking this replaces the spec's value in every step (the prompt replaces its prompt list, a concurrency its scenarios); the rest stays the spec's. The runs are then not of the spec: they record spec = custom, with spec-derived-from naming the version and spec-derived-fields what changed."
spec-override = "Override (custom, derived from the spec)"
name = "Name"
campaign-name-hint = "The bench.db campaign the runs go into, as `--campaign`: an existing name adds to it. Empty: a campaign of its own, named after the run's stamp (spec-<name>-v<version>-<stamp> for a spec)."
question = "Question"
question-hint = "What the campaign is meant to answer, as `--question`: stored with it, and what `bench answer` later answers."
ab-key = "A/B key"
ab-key-hint = "A preset key to compare values of, as bench run --key: every step of the run (each prompt, scenario and spec pass) runs once per value, with the value written to the selected presets and llama-server restarted around it; the key is put back afterwards. The list is the preset keys that change how the model is launched (placement, KV cache, batch sizes, speculator...). none = no A/B.\nUnder a spec, a key its passes do not touch keeps the runs spec runs; a key a pass overrides (spec-type under standard) records them as custom, derived from the spec."
values = "Values"
values-hint = "The values to compare, as bench run --values: comma-separated, a range 2..8, `unset` to remove the key for one leg; separate with ; when a value holds commas (tensor-split, device), and end a single such value with ;. Each value is checked against the presets before Run starts."
preview = "Preview"
