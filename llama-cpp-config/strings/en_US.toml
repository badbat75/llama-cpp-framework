moe-cache-hint = "--moe-cache-mib (llama.cpp v0.7.0+, experimental): VRAM, in MiB, caching the experts kept in host memory, so a token whose experts were used recently reads them from the card instead of over PCIe.\nIt only acts on layers whose experts are ALL in RAM (MoE CPU layers above, or an exps=CPU Tensor placement rule); with none, llama.cpp runs without a cache.\nWith several GPUs the budget is split like the layers: by Tensor split, or by free VRAM when that is blank.\nThe model FAILS TO LOAD under Split mode tensor, and below the experts of one token{0}\nThe draft model never uses it, and the synthetic benchmark cannot measure it (llama-bench has no such option).\ndefault = omit the flag → llama.cpp default: 0 (no cache)."
