assets = "Assets"
model-file = "Model file"
model-file-hint = "Main model weights for this preset (--model / -m).\nPick a .gguf from models\\."
project-url = "Project URL"
project-url-hint = "The model's project page, e.g. its Hugging Face repository.\nSaved as a `; url =` comment in the preset's section: llama-server has no such option and would refuse a key it does not know.\nOpen shows it in the browser."
mmproj-hint = "Multimodal projector (--mmproj) for vision models, so the server can read images.\nBlank for text-only models."
draft-model = "Draft model"
draft-model-hint = "Optional speculator (feeds --model-draft).\nPicking one sets Drafter from the file's own GGUF header (DFlash vs DSpark vs MTP), falling back to the folder it came from (mtps\\ → draft-mtp, dflashs\\ → draft-dflash); the ticked N-gram drafters stay.\nPicking one auto-pins the draft to the server GPU, or CPU if none.\n(none) = no draft model.\nLeave at (none) when the MAIN model already embeds MTP heads: those need only Drafter."
drafter-hint = "The draft-model speculator (the draft-* entry of --spec-type).\nAuto-set when you pick a draft model above, read from that file's header: a DFlash drafter carrying a Markov head is draft-dspark, one without it draft-dflash, a nextn head draft-mtp.\nNeeds a draft model or MTP heads in the main model; without either only none is offered.\nOverride only if you know what you need."
n-gram-drafters = "N-gram drafters"
n-gram-drafters-hint = "The ngram-* entries of --spec-type, any number of them, beside the drafter above: llama.cpp tries the n-grams first and falls back to the draft model when none of them matches.\nThey need no draft: they draft from the tokens already in the context, which pays off when the output repeats it (code edits, quoting, refactors).\nEach one's tuning is under Speculative decoding below."
model-info = "Model info"
type = "Type"
type-hint = "Dense runs every weight each token; MoE activates only a few experts, so VRAM ≈ all weights but compute ≈ active experts.\nMoE is what makes the 'MoE CPU layers' lever below useful; on a dense model the FFN lever is 'Dense FFN CPU layers' (--n-cpu-ffn)."
moe-layers = "MoE layers"
moe-layers-hint = "How many layers carry expert (FFN) weights, the useful upper bound for the 'MoE CPU layers' lever (--n-cpu-moe) below (its slider runs to the total layer count).\nRaise it to move more expert layers to CPU: less VRAM, slower generation."
arch-quant = "Arch / quant"
embeddings = "Embeddings"
embeddings-hint = "token_embd.weight's OWN quant and size; the file's name does not tell you this (Unsloth's Q6_K_XL keeps it at Q8_0; its Q4_K_XL/Q5_K_XL drop it to a K-quant).\nIt decides whether the Tensor placement rule below may pin the embedding table to a GPU: the GPU needs a get_rows kernel for that exact type. Since llama.cpp b10089 (#25962, 2026-07-22) CUDA/ROCm/Vulkan cover the float types, the legacy Q4_0..Q8_0 quants, every K-quant and the IQ-quants (IQ4_NL/MXFP4 only when the embedding width is a multiple of 256); what is left out (Q8_1, Q8_K, the ternary TQ types, NVFP4) still round-trips the whole table to host RAM on every token, and decode collapses.\nThe size is the VRAM the pin ADDS to that card: budget it against the KV cache, or the card starts paging."
layers-ctx = "Layers / ctx"
layers-ctx-hint = "block_count guides --n-gpu-layers; the trained context is the sane upper bound for --ctx-size (going higher needs RoPE scaling)."
attention = "Attention"
attention-hint = "Head counts.\nFewer KV heads (GQA) shrink the KV cache, so a higher --ctx-size fits in the same VRAM."
memory = "Memory"
memory-hint = "What llama.cpp keeps of past tokens: a KV cache (attention), a fixed-size state (recurrent), or both (hybrid).\nA recurrent state cannot be rewound to an earlier token, so on recurrent and hybrid models reusing a prompt prefix needs a context checkpoint (Context checkpoints); with attention alone the KV cache is simply truncated.\nRead from the architecture, per llama.cpp's own lists."
chat-template = "Chat template"
chat-template-hint = "Whether the GGUF embeds a Jinja2 chat template (metadata key tokenizer.chat_template).\nJinja (embedded) = llama-server applies it automatically to /v1/chat/completions.\nembedded (non-Jinja) = marker-less/older form; may need --chat-template <name> or --jinja off.\nnone = pass --chat-template / --chat-template-file to supply one."
thinking = "Thinking"
thinking-hint = "Whether the embedded chat template does reasoning, and whether the Reasoning field (--reasoning on|off) can switch it: that flag only sets the template variable enable_thinking, so a template that never mentions it thinks no matter what you pick (auto = on, off = on).\nRead from the template's SOURCE: this app has no Jinja engine, while llama.cpp answers the same question by rendering the template. The verdict is therefore about the TEMPLATE, not the model: 'no marker in the chat template' does not prove the model can't think (MiMo-VL's template names nothing, yet the model emits <think> and llama-server parses it out of the output); it proves only that neither --reasoning nor Keep past thinking has anything here to act on."
past-thinking = "Past thinking"
past-thinking-hint = "Whether 'Keep past thinking' (--reasoning-preserve) is a LEVER on this model. The flag sets three template variables at once (preserve_thinking, clear_thinking, truncate_history_thinking), and templates read different ones; a template that names NONE of them cannot see the flag, so setting it there does nothing.\nThis is what llama-server's log cannot tell you: its probe reports 'supports preserving reasoning' by rendering the template and checking a past trace came out, which is equally true of a template that preserves unconditionally and of one you can actually control."
selected-mmproj-hint = "The selected multimodal projector: projector type, modality (vision/audio), encoder depth, and native image / patch size."
draft = "Draft"
draft-hint = "What actually drafts for this preset: the MTP (next-n) layers the model itself embeds, plus the draft file picked in the Assets card above (the row below reads that file's header).\nNothing else appears here. A drafter sitting in mtps\\ / dflashs\\ that this preset does not point at is not part of the config, and naming it made this row read as if it were: it is offered in the Draft model picker above and nowhere else.\nnone = no embedded heads and no draft file: this preset does not speculate."
draft-file = "Draft file"
draft-file-hint = "The selected draft/MTP/DFlash file's own header: arch, quant, layers, and (DFlash) trained block_size with the implied --spec-draft-n-max ceiling."
no-model-selected = "Select a model to see its GGUF details."
gpu-distribution = "GPU distribution"
gpu-distribution-intro = "How THIS model is split across GPUs (split-mode), which ones it runs on (device) and how much each holds (tensor-split), all saved to presets.ini. Checking nothing inherits the server default. Two GPUs of different sizes? Check both and give the bigger one more. In layer mode, once the model's header is read the column counts BLOCKS instead of ratios: that is what llama.cpp actually cuts, and each row says which ones it gets (the last position is the output layer, not a block). Drag a slider to move the cut; the other rows pay for it when you let go. The checked rows, top to bottom, are the split order: drag ≡ to reorder; the first one is llama.cpp's main GPU."
clear = "Clear"
split-mode-hint = "Multi-GPU split for THIS model (split-mode), same on CUDA and HIP.\nlayer (default): each GPU takes a consecutive run of blocks; the table edits the cut. Fastest prefill, tolerates a slow GPU link.\nnone: single GPU, the first checked row; the other checked rows go unused.\ntensor (experimental): tensor parallelism. The checked GPUs become one device and every weight AND the KV cache are cut across them by the ratio (blank = even). Fastest decode, needs a fast GPU link. Flash attention must be on (auto is promoted), fit is skipped (size ctx-size yourself), some architectures are refused at load, and llama.cpp tunes it for CUDA with no guarantees on other backends.\nrow (deprecated, superseded by tensor): weight matrices are split row-wise by the ratio (needs CUDA/ROCm; Vulkan falls back to the layer cut); the KV cache still follows the layer cut.\nIrrelevant with one GPU checked."
tensor-placement = "Tensor placement"
tensor-placement-intro = "Exceptions to the table above (--override-tensor): tensors that go on a device of their own, whatever their layer does. The one that usually pays: llama.cpp keeps the EMBEDDING TABLE in pinned host RAM even when it reports every layer offloaded, which is what Windows counts as \"Shared GPU memory\", so a model that fits in VRAM with room to spare still shows GBs of it. Put it on a GPU to reclaim that; send big tensors to CPU to free VRAM instead. Rules apply in order: the first match wins."
hardware-config = "Hardware Config"
gpu-layers = "GPU layers"
gpu-layers-hint = "--n-gpu-layers: model layers offloaded to GPU.\nSlider max = the model's layer count (all on GPU); lower keeps layers on CPU to save VRAM.\ndefault = omit the flag → llama.cpp offloads ALL layers to GPU (the framework runs with -fit off, so there is no auto-fit to VRAM; a model too big to fit will fail to load)."
moe-cpu-layers = "MoE CPU layers"
moe-cpu-layers-hint = "Number of Mixture-of-Experts layers whose expert (FFN) weights stay on CPU (--n-cpu-moe) to save VRAM.\nOnly affects MoE models: it expands into one override-tensor rule per layer over the ffn_*_exps tensors, which a dense model does not have; for a dense model use 'Dense FFN CPU layers' below.\nSlider max = the model's layer count.\ndefault = omit the flag → 0: no expert weights are kept on CPU, so every expert stays on GPU with its layer."
moe-cache = "MoE cache (MiB)"
dense-ffn-cpu-layers = "Dense FFN CPU layers"
dense-ffn-cpu-layers-hint = "Number of layers whose DENSE feed-forward weights (ffn_up / ffn_down / ffn_gate) stay on CPU (--n-cpu-ffn, llama.cpp v0.4.0+) to save VRAM.\nThe dense twin of 'MoE CPU layers': on a dense model it is the whole FFN of the first N layers (most of the layer's bytes, attention stays on the GPU); on a MoE model it only reaches the dense layers such a model may carry (a leading dense prefix, every-Nth-layer hybrids), never the experts.\nSlider max = the model's layer count.\ndefault = omit the flag → every FFN stays on the GPU with its layer.\nNote the synthetic benchmark expands this into per-layer override-tensor rules: llama-bench has no -ncffn of its own."
op-offload = "Op offload"
op-offload-hint = "--op-offload / --no-op-offload: whether an operation whose weights sit in HOST memory is still run on the GPU.\ndefault = omit the flag → llama.cpp default: on. off = --no-op-offload, the one value that changes anything; on pins today's default.\nIt pairs with the two rows above and with Tensor placement: those are what leave weights in RAM (MoE experts, any tensor sent to CPU). On, such an operation goes to the card for batches of 32+ tokens, and its weights are copied there on EVERY prefill batch; on a card behind a narrow PCIe link that copy dominates.\nWith experts in RAM on such a link, off prefills faster (the Qwen3.8-Flash-Next guide has the figures). Decode is unchanged: a single-token step never offloads.\nA no-op when every weight is in VRAM."
repack = "Repack"
repack-hint = "--repack / --no-repack: rewrite weights kept in host RAM into the CPU's interleaved layout at load, for the types it has kernels for (x86 AVX2: Q4_0, Q4_K, IQ4_NL, MXFP4; Q2_K with AVX-512; never the other IQ types).\ndefault = omit the flag → llama.cpp default: on. off = --no-repack, the one value that changes anything.\nIt acts only without a GPU: with one (CUDA, ROCm and Vulkan alike), weights kept in RAM go to that GPU's pinned host buffer, which llama.cpp picks before the repacked layout, so the flag is a no-op there (the MoE cache sees every expert in RAM whatever it says) unless No host buffer is on.\nA no-op when no weight is in RAM."
no-host-buffer = "No host buffer"
no-host-buffer-hint = "--no-host: keep the weights left in RAM in ordinary memory instead of the GPU's pinned host buffer.\noff = omit the flag → llama.cpp default: pinned (ROCm_Host / CUDA_Host), which the GPU reads directly.\non = ordinary RAM, so the CPU repacks the types it has kernels for (see Repack) and the RAM stays pageable. The copies op-offload makes per batch then come from pageable memory, and repacked experts leave the MoE cache.\nA no-op when no weight is in RAM."
lazy-tensors = "Lazy tensors"
lazy-tensors-hint = "--lazy-mode: read the tensors the architecture marks for it from disk on demand, one row per token, instead of keeping them resident in RAM.\nToday that is the per-layer token-embedding tables of gemma4 and qwen4exp (e.g. the n-gram table of Qwen3.8-Flash-Next-GSQ-RCO); a no-op on every other model.\ndefault = omit the flag → llama.cpp default: auto, i.e. lazy only for a table over 4 GiB, and off when one of the model's devices cannot mmap (an integrated GPU).\non = lazy whatever the size and the devices; off = always resident (no paging cost, all of the RAM).\nWorks whatever the server's Load mode is. Keep the GGUF on an SSD."
load-mode = "Load mode"
load-mode-hint = "How llama.cpp brings THIS model's weights in (-lm / --load-mode). One setting, not two: mlock, mmap and Direct I/O are mutually exclusive states of the same enum.\ndefault = omit the flag → llama.cpp default: auto.\nauto memory-maps the GGUF unless a device can't; fastest to load.\nnone reads the weights into RAM up front: slower, costs the model's size in RAM, but nothing can be dropped back to the file.\nmmap always memory-maps.\nmlock locks the weights in physical RAM WITHOUT mmapping: keeps latency stable, needs room for the whole model.\nmmap+mlock memory-maps and locks what it maps.\ndio uses Direct I/O where the platform offers it.\nLazy tensors are mapped whatever this says."
fit-to-vram = "Fit to VRAM"
fit-to-vram-hint = "Let llama.cpp size the context and the GPU layers to fit device memory (fit = on|off), leaving about 1 GiB free per GPU.\nAvailable only with Context and GPU layers both at default: those are the two things it sizes. Off by default, and always written: llama.cpp's own default is on, and a 'default' GPU layers here means 'offload every layer', which the fit would cut.\nWith it on, also leave tensor-split, Tensor placement, MoE CPU layers and Dense FFN CPU layers empty: any of them makes llama.cpp skip the layer placement (a warning in the log) and fit only the context."
fit-allowed = "auto-fit context and layers to device memory (-fit on)"
fit-not-allowed = "needs Context and GPU layers at default"
fit-min-context = "Fit min context"
fit-min-context-hint = "--fit-ctx: the smallest context the fit may cut down to while making the model fit device memory.\nRead only with Fit to VRAM on.\ndefault = omit the flag → llama.cpp default: 4096."
fit-free-vram = "Fit free VRAM (MiB)"
fit-free-vram-hint = "--fit-target: the VRAM the fit leaves free on each device, in MiB. One number for every device, or a comma-separated list in device order (e.g. 2048,1024).\nRead only with Fit to VRAM on.\nBlank = omit the flag → llama.cpp default: 1024 per device."
embedded-mtp-note = "Embedded MTP heads: the draft runs inside the main model's context, on the model's own GPU. Draft device and Draft GPU layers apply only to a separate draft model file, so they stay disabled here."
draft-device = "Draft device"
draft-device-hint = "GPU for a separate draft model file (--device-draft).\nPin to ONE device: multi-GPU auto-split crashes MTP heads.\nIgnored (and disabled) with embedded MTP heads: that draft shares the main model's context and device.\nBlank = auto / same as model."
draft-gpu-layers = "Draft GPU layers"
draft-gpu-layers-hint = "Layers of a separate draft model file offloaded to GPU (--n-gpu-layers-draft).\nA drafter with real layers (e.g. DFlash) gets a 0..layer-count slider.\nAn MTP/nextn head file has no transformer layers (block_count 0), so it becomes a plain CPU/GPU switch.\nPin a device above: multi-GPU auto-split crashes MTP heads.\nIgnored (and disabled) with embedded MTP heads.\ndefault = omit the flag → llama.cpp offloads ALL draft layers to GPU."
resource-context = "Resource / context"
context-size = "Context size"
context-size-hint = "Context window in tokens (--ctx-size).\nBigger = longer history but more KV-cache VRAM; split across parallel slots.\ndefault = omit the flag → llama.cpp default: 0, i.e. load the context the model was TRAINED with (which can be far more than the number shown here)."
parallel-seqs = "Parallel seqs"
parallel-seqs-hint = "--parallel: concurrent request slots. The context is DIVIDED among them, so N=2 leaves each request ctx-size / 2 tokens.\ndefault = omit the flag → llama-server's own default is auto (-1), which picks 4 slots AND a unified KV cache, and with a unified cache every slot may use the WHOLE context. So leaving this at default is what gives one request the model's full context; pinning a number is what quietly divides it."
unified-kv = "Unified KV"
unified-kv-hint = "--kv-unified / --no-kv-unified: one KV buffer shared by every parallel slot, so each request may grow into the WHOLE context instead of ctx-size / parallel.\ndefault = omit the flag → off with Parallel seqs pinned. With Parallel seqs at default (auto) llama-server turns it on whatever this says, hence disabled there.\non pays when requests are uneven (one long, others short); off gives each slot a fixed share, so one long request cannot starve the others of cells."
per-slot-context = "Per-slot context"
per-slot-context-hint = "--kv-unified-per-slot: caps every slot at this many tokens.\nWith Context size at default it also SIZES the KV pool to Parallel seqs × this value instead of the model's trained context, so a 4-slot preset at 32768 allocates 128k cells.\nWorks with Unified KV on or off.\ndefault = omit the flag → no cap."
batch-size = "Batch size"
batch-size-hint = "--batch-size: logical batch (tokens prefilled per step).\nHigher speeds prefill, uses more VRAM.\ndefault = omit the flag → llama.cpp default: 2048."
u-batch-size = "U-Batch size"
u-batch-size-hint = "--ubatch-size: physical micro-batch computed at once.\nMust be ≤ batch size.\ndefault = omit the flag → llama.cpp default: 512."
embedding-mode = "Embedding mode"
embedding-mode-hint = "--embeddings: serve this model as an embedding model, i.e. turn on /v1/embeddings (without it llama-server answers 501 \"This server does not support embeddings\"). Only for dedicated embedding models.\noff = omit the flag → llama.cpp default: off.\nEvery input is processed in ONE micro-batch, so set Batch size and U-Batch size above to at least the longest text you send, or the request fails with \"input is too large\" (the default micro-batch is 512 tokens)."
pooling = "Pooling"
pooling-hint = "--pooling: how the token vectors become ONE embedding.\ndefault = omit the flag → the model's own pooling, read from its GGUF.\nnone = one vector per token; mean = their average; cls = the first token's; last = the last token's (Qwen3-Embedding); rank = the reranker head.\nA wrong pooling still yields vectors of the right size, only worse ones: search quality drops without an error.\nRead only in embedding mode."
kv-cache = "KV cache"
k-cache-type = "K-cache type"
k-cache-type-hint = "KV cache quantization for K (--cache-type-k).\nLower = less VRAM but lower quality.\ndefault = omit the flag → llama.cpp default: f16.\nNote: Qwen3-Coder needs q8_0 for reliable tool calling; q4_0 makes it drop the <tool_call> wrapper."
v-cache-type = "V-cache type"
v-cache-type-hint = "KV cache quantization for V (--cache-type-v).\nLower = less VRAM, lower quality; usually matched to K.\nNeeds flash attention.\ndefault = omit the flag → llama.cpp default: f16."
flash-attention = "Flash Attention"
flash-attention-hint = "The fused flash-attention kernel (--flash-attn): faster prefill and lower KV memory.\ndefault = omit the flag → llama.cpp default: auto, i.e. on wherever the backend supports it, off where it doesn't.\non forces it (llama.cpp errors out if the backend can't); off disables it, which also takes away most of the gain from a quantized K/V cache."
cache-ram = "Cache RAM (MiB)"
cache-ram-hint = "--cache-ram: RAM limit (MiB) for the prompt cache (past-prompt KV kept for reuse).\nA cached prompt carries its context checkpoints with it, and they count against this limit: on a large hybrid model with long prompts, many checkpoints and several slots, the oldest entries get evicted sooner than the KV size alone suggests.\ndefault = omit the flag → llama.cpp default: 8192 MiB.\n0 disables; -1 = no limit."
cache-reuse = "Cache reuse"
cache-reuse-hint = "--cache-reuse: minimum chunk (tokens) a new prompt may reuse from the cached one by shifting the KV cache, skipping its re-prefill.\nHigher saves compute on shared prefixes.\ndefault = omit the flag → llama.cpp default: 0 (disabled).\nllama.cpp turns it off on a model with an mmproj (vision) and on one whose cache cannot shift, with a warning in the log."
context-checkpoints = "Context checkpoints"
context-checkpoints-hint = "--ctx-checkpoints: how many context checkpoints a slot keeps.\nA recurrent or hybrid model (Qwen3.5/3.8, qwen4exp, Mamba, Jamba...) and an SWA model cannot truncate their state back to an earlier token, so a new request whose prompt diverges from the cached one resumes from the newest checkpoint before that point; with none, the whole prompt is read again.\nEach checkpoint is a copy of that state in host RAM; the oldest is dropped once the slot holds this many. Inert on a pure-attention model.\ndefault = omit the flag → llama.cpp default: 32. 0 disables them."
checkpoint-step = "Checkpoint step"
checkpoint-step-hint = "--checkpoint-min-step: the minimum distance, in tokens, between two context checkpoints.\nSmaller = a diverging prompt resumes closer to where it diverged, at the cost of more checkpoints, i.e. more RAM (the ones of a cached prompt also count against Cache RAM).\ndefault = omit the flag → llama.cpp default: 8192. 0 = no minimum."
chat-reasoning = "Chat / reasoning"
use-chat-template-hint = "--jinja: use the model's embedded Jinja chat template instead of built-in heuristics.\nRecommended on for correct tool-call / role formatting."
use-chat-template = "use embedded chat template (--jinja)"
prefill-assistant = "Prefill assistant"
prefill-assistant-hint = "--prefill-assistant / --no-prefill-assistant: what to do when a request's LAST message is an assistant message.\nOn (llama.cpp's default, the key omitted): treat it as the START of the reply and continue it; this is what lets a client seed the answer's opening.\nOff: treat it as a finished turn and answer it instead. Turn it off if a client legitimately ends on an assistant turn and the model resumes mid-sentence rather than replying."
prefill-assistant-toggle = "continue a trailing assistant message (--prefill-assistant)"
reasoning = "Reasoning"
reasoning-hint = "Thinking mode (--reasoning).\nauto: model decides (for Gemma auto≡on).\non: force thinking.\noff: disable.\nNote reasoning=on can invalidate the KV cache mid-conversation; prefer auto."
reason-format = "Reason format"
reason-format-hint = "--reasoning-format: how thinking output is delivered.\nauto = let the template decide; deepseek = parse <think> blocks into a separate reasoning channel; none = inline."
reasoning-effort = "Reasoning effort"
reasoning-effort-hint = "--reasoning-effort: how hard the template should ask the model to think.\ndefault = omit the flag → whatever the template does on its own.\nNeither a switch nor a token cap: it is a level handed to the chat template, so a template that reads neither reasoning_effort nor reasoning_strength ignores it in silence. gpt-oss and harmony templates read it; most do not.\nDo NOT hand-write reasoning_effort into 'Template kwargs' below: this ONE flag binds both names at once, and a raw kwarg sets one of the two, a silent no-op on a template keyed to the other.\nllama-server prints nothing about this at startup, unlike 'Keep past thinking', so the Thinking row in Model info is the only place that tells you whether it is a lever here.\nNeeds llama.cpp b10434 or newer: an older server rejects the key outright and refuses to start."
keep-past-thinking = "Keep past thinking"
keep-past-thinking-hint = "--reasoning-preserve: replay the thinking of EVERY past assistant turn back to the model, not just the last one.\ndefault = pass no flag and take llama.cpp's default, which is ON since v0.4.0 (up to v0.3.0 it was whatever the chat template did on its own); on = keep it (pinned, whatever the default becomes); off = drop it (--no-reasoning-preserve), the one value that changes anything on a current server.\nThis is the supported lever; do NOT hand-write preserve_thinking (or preserve_reasoning, deprecated there since v0.4.0) into 'Template kwargs' below. llama.cpp expands this ONE flag into preserve_thinking + clear_thinking + truncate_history_thinking, and templates disagree on which of the three they read, so setting the raw kwarg is a silent no-op on most of them.\nIt only works where the template supports it; llama-server says so at startup ('chat template supports preserving reasoning, it is enabled by default' / '…does NOT support').\nCosts prompt tokens: the trace is re-sent every turn."
output-budget-note = "The next three split one output budget in two. --reasoning-budget caps the THINKING alone; nothing caps the answer on its own, because --n-predict bounds thinking + answer together, so the answer gets what the thinking leaves. Do not copy a model card's raw pair in: those are ceilings for the context the card assumes, and a budget larger than your context never fires."
thinking-budget = "Thinking budget"
thinking-budget-hint = "Tokens the thinking block may use (--reasoning-budget).\n-1 = unrestricted, 0 = close it immediately, N > 0 = a real budget.\ndefault = omit the flag → llama.cpp default: -1.\nNot a truncation: at the limit the sampler FORCES the template's end-of-thinking tag, so the model still writes a normal answer. It only works where the template declares thinking tags.\nPick it by how long you are willing to wait: at 20 tok/s, 16384 tokens is about 13 minutes of thinking."
budget-message = "Budget message"
budget-message-hint = "Text injected just before the forced end-of-thinking tag when the budget runs out (--reasoning-budget-message), to steer the model into wrapping up instead of stopping mid-thought.\nBlank = omit the flag: llama.cpp closes the block with no message.\nWrite it in the language the model answers in: an injection in another language invites language mixing.\nNo ';' or '#': the INI format cannot escape them and the value would reload truncated."
budget-message-placeholder = "e.g. Budget reached, write the final answer now."
max-output = "Max output"
max-output-hint = "Total tokens generated per request, thinking AND answer together (--n-predict).\n-1 = keep going until the context is full.\ndefault = omit the flag → llama.cpp default: -1.\nOnly a DEFAULT, never a clamp: the request's own max_tokens wins whenever the client sends one, in either direction, so this bites only clients that send none."
sampling-overrides = "Sampling overrides"
sampling-temperature-hint = "--temp: sampling temperature.\nLower = more deterministic, higher = more creative.\ndefault = omit the flag → llama.cpp default: 0.80."
top-k-hint = "--top-k: keep only the K most-likely tokens before sampling.\n0 / default = disabled.\ndefault = omit the flag → llama.cpp default: 40."
top-p-hint = "--top-p: nucleus sampling, smallest token set whose probabilities sum to P (e.g. 0.95).\ndefault = omit the flag → llama.cpp default: 0.95."
min-p-hint = "--min-p: drop tokens below this fraction of the top token's probability.\ndefault = omit the flag → llama.cpp default: 0.05."
repeat-penalty = "Repeat penalty"
repeat-penalty-hint = "--repeat-penalty: >1 discourages repeating recent tokens (e.g. 1.1).\ndefault = omit the flag → llama.cpp default: 1.0."
presence-penalty = "Presence penalty"
presence-penalty-hint = "--presence-penalty: positive values discourage reusing any seen token, pushing new topics.\ndefault = omit the flag → llama.cpp default: 0.0."
backend-sampling = "Backend sampling"
backend-sampling-hint = "--backend-sampling (experimental): run the sampler chain on the GPU that holds the logits instead of copying every logit row to the host and sampling there.\ndefault = omit the flag → llama.cpp default: off. off writes the key but launches exactly like default (the flag has no negated form); on is the one value that changes anything.\nOnly some samplers have a GPU kernel (greedy, dist, top-k, top-p, min-p, temp, penalties, logit-bias). Any other sampler in the chain (typical, xtc, mirostat, top-n-sigma, dry, adaptive-p) drops the WHOLE chain back to CPU sampling, silently.\nDisabled outright by a grammar / JSON schema and by a Thinking budget (llama-server warns at startup), and by split mode 'tensor' (one warning per process). A request asking for pre-sampling probabilities takes the CPU path for that request.\nThe draft side is a separate flag that is already ON by default (--spec-draft-backend-sampling): an MTP/DFlash drafter samples on the backend whatever this says."
advanced = "Advanced"
chat-kwargs = "Chat kwargs"
chat-kwargs-hint = "--chat-template-kwargs: JSON merged into the chat template, e.g. {\"enable_thinking\":true}.\nAdvanced: leave blank unless the model documents kwargs."
vision = "Vision"
vision-on-gpu = "Vision on GPU"
vision-on-gpu-hint = "Offload the multimodal projector, the mmproj/CLIP image encoder, to GPU (--mmproj-offload / --no-mmproj-offload).\nOn (llama.cpp's default) it holds VRAM for as long as the model is loaded but only computes on image requests. Off keeps it on CPU: slower image encoding, no VRAM.\nWHICH GPU it lands on is a separate question; see 'Vision GPU' below."
vision-offload-toggle = "offload the image encoder to GPU"
vision-gpu = "Vision GPU"
vision-gpu-hint = "The GPU the image encoder runs on (--mmproj-device).\ndefault = omit the flag → llama.cpp's own placement: the FIRST entry of this preset's device list; with no device pinned, the FIRST GPU backend it finds, which on a mixed box is often not the one running the model. It then holds VRAM there and stays idle until an image arrives.\nName a device here to override both."
image-tokens-note = "The two bounds below cap the tokens ONE image takes on dynamic-resolution vision models; only the mmproj/CLIP encoder reads them (pick an MMProj above to enable them). Leave at default to read the bound from the model."
min-image-tokens = "Min image tokens"
min-image-tokens-hint = "--image-min-tokens: minimum tokens each image is encoded to.\nOnly used by vision models with dynamic resolution.\ndefault = omit the flag → read the bound from the model.\nQwen-VL warns it needs at least 1024 for grounding accuracy (llama.cpp #16842); set 1024 here if you see that warning."
max-image-tokens = "Max image tokens"
max-image-tokens-hint = "--image-max-tokens: maximum tokens each image is encoded to.\nOnly used by vision models with dynamic resolution.\ndefault = omit the flag → read the bound from the model.\nLower it to cap the prefill cost (and VRAM) of large images."
speculative-decoding = "Speculative decoding"
draft-model-group = "Draft model (draft-mtp, draft-dflash, draft-dspark, draft-simple)"
draft-n-max = "Draft n-max"
draft-n-max-hint = "Max draft tokens proposed per step (--spec-draft-n-max).\nDFlash clamps this to the GGUF's trained block_size-1 (e.g. 15).\ndefault = omit the flag → llama.cpp default: 3."
draft-p-min = "Draft p-min"
draft-p-min-hint = "Confidence floor for drafted tokens (--spec-draft-p-min), 0 to 1.\nDrafting stops at the first token below it, so the model verifies a shorter batch instead of tokens it would reject.\nDFlash2 reads its selector, DSpark its confidence head.\ndefault = omit the flag → llama.cpp default: 0 (never truncate)."
draft-n-min = "Draft n-min"
draft-n-min-hint = "Shortest draft worth verifying (--spec-draft-n-min).\nA draft that comes out shorter, typically because Draft p-min cut it, is DISCARDED: that step decodes one token without speculation.\nRaise it when short drafts cost more to verify than they save.\ndefault = omit the flag → llama.cpp default: 0 (keep any length)."
draft-n-ubatch = "Draft n-ubatch"
draft-n-ubatch-hint = "Physical batch of the draft context (--spec-draft-n-ubatch, llama.cpp v0.7.0+).\nSmaller shrinks the draft's compute buffer, i.e. spares VRAM, at the cost of more passes when the drafter catches up on a long prompt.\nApplies to MTP heads embedded in the main model too, not only to a draft file.\ndefault = omit the flag → llama.cpp default: 0 (the model's own U-Batch size)."
draft-cache-note = "The draft context keeps its OWN KV cache, and it does not follow the model's: llama.cpp overwrites the inherited types with the draft default, f16. Quantize it here to reclaim the VRAM; unlike the placement flags above, these two also apply to MTP heads embedded in the main model."
draft-k-cache-type = "Draft K-cache type"
draft-k-cache-type-hint = "KV cache quantization for K in the DRAFT context (--spec-draft-type-k, alias -ctkd).\ndefault = omit the flag → llama.cpp's DRAFT default: f16, NOT the model's K-cache type, which llama.cpp copies in and then overwrites.\nA draft context is small, so this matters most on a separate draft model with a large context."
draft-v-cache-type = "Draft V-cache type"
draft-v-cache-type-hint = "KV cache quantization for V in the DRAFT context (--spec-draft-type-v, alias -ctvd).\ndefault = omit the flag → llama.cpp's DRAFT default: f16, independent of the model's V-cache type.\nUsually matched to the draft K type; quantized V needs flash attention."
match-length = "Match length"
match-length-hint = "Tokens of context the lookup matches before it proposes a draft (--spec-ngram-mod-n-match).\nBelow 16 llama.cpp warns of poor drafts.\ndefault = omit the flag → llama.cpp default: 24."
min-draft = "Min draft"
min-draft-hint = "Fewest tokens a draft must have to be proposed (--spec-ngram-mod-n-min), 0 to 1024.\ndefault = omit the flag → llama.cpp default: 48."
max-draft = "Max draft"
max-draft-hint = "Most tokens drafted per step (--spec-ngram-mod-n-max), 0 to 1024.\ndefault = omit the flag → llama.cpp default: 64."
lookup-n-gram = "Lookup n-gram"
ngram-simple-lookup-hint = "Length of the n-gram looked up in the context (--spec-ngram-simple-size-n), 1 to 1024.\ndefault = omit the flag → llama.cpp default: 12."
draft-m-gram = "Draft m-gram"
ngram-simple-draft-hint = "Length of the m-gram drafted after a match (--spec-ngram-simple-size-m), 1 to 1024.\ndefault = omit the flag → llama.cpp default: 48."
ngram-map-lookup-hint = "Length of the n-gram looked up in the context (--spec-ngram-map-k-size-n), 1 to 1024.\ndefault = omit the flag → llama.cpp default: 12."
ngram-map-draft-hint = "Length of the m-gram drafted after a match (--spec-ngram-map-k-size-m), 1 to 1024.\ndefault = omit the flag → llama.cpp default: 48."
ngram-map-values-lookup-hint = "Length of the n-gram looked up in the context (--spec-ngram-map-k4v-size-n), 1 to 1024.\ndefault = omit the flag → llama.cpp default: 12."
ngram-map-values-draft-hint = "Length of the m-gram drafted after a match (--spec-ngram-map-k4v-size-m), 1 to 1024.\ndefault = omit the flag → llama.cpp default: 48."
min-hits = "Min hits"
min-hits-hint = "Times an n-gram must have been seen before its continuation is proposed (--spec-ngram-map-k4v-min-hits).\nHigher drafts less often but more reliably.\ndefault = omit the flag → llama.cpp default: 1."
save-preset = "Save preset"
server-intro = "Machine-wide llama-server settings (server.ini). Per-model knobs live under Models."
network = "Network"
port = "Port"
port-hint = "TCP port llama-server listens on (--port).\ndefault = omit the flag → llama.cpp default: 9931 (8080 before llama.cpp v0.7.0). The chat UI and integrations connect here."
bind-to = "Bind to"
bind-to-hint = "Addresses to listen on (--host); check one or more, each is bound on its own.\nlocalhost = this PC only; 0.0.0.0 = all interfaces, reachable from the LAN, and exclusive: it already covers every other row, so checking it clears them.\nThe chat UI and integrations connect to a loopback address when one is checked, otherwise to the first one."
base-url = "Base URL"
base-url-hint = "Base URL for integrations (opencode.json + Claude Code).\nDefault = auto from host+port (/v1 appended for opencode.json). Uncheck to override for proxy/gateway."
api-key = "API Key"
api-key-hint = "Authentication key for the integration provider.\nNo key = none. Used when behind a proxy or LLM gateway that requires an API key."
no-key = "No key"
resources = "Resources"
cpu-threads = "CPU threads"
cpu-threads-hint = "--threads: CPU threads for generation.\ndefault = omit the flag → llama.cpp auto-detects the physical-core count. More won't help once GPU-bound. Max = logical processors."
batch-threads = "Batch threads"
batch-threads-hint = "--threads-batch: CPU threads for prompt processing (prefill).\ndefault = omit the flag → llama.cpp defaults to the same as --threads. Max = logical processors."
max-models = "Max models"
max-models-hint = "--models-max: how many preset models llama-server keeps resident at once.\n1 = load one at a time (lowest VRAM); higher lets it hot-swap without reloading.\ndefault = omit the flag → llama.cpp default: 4.\n0 = unlimited."
memory-margin = "Memory margin"
memory-margin-hint = "--models-memory-margin: MiB of memory llama-server keeps free on every GPU.\nBefore loading a model it unloads the least recently used ones until the new one fits, on top of Max models.\ndefault = omit the flag → llama.cpp default: 0 (off: only Max models limits what stays loaded)."
models-folder = "Models folder"
models-folder-hint = "Root folder scanned for GGUFs.\nPickers read its subfolders: models\\, mmprojs\\, mtps\\, dflashs\\."
models-folder-placeholder = "root dir (models\\ and mmprojs\\ underneath)"
web-ui = "Web UI"
web-ui-hint = "Serve the built-in chat UI at / (off = --no-ui).\nThe OpenAI-compatible API, the Integrations tab and the benchmark keep working with it off; Open chat UI is disabled while the running server has no UI.\ndefault = on (llama.cpp's default)."
serve-chat-ui = "serve the built-in chat UI"
web-ui-mcp-proxy = "Web UI MCP proxy"
web-ui-mcp-proxy-hint = "Enable the built-in chat UI's MCP CORS proxy (--webui-mcp-proxy).\nThe bundled chat UI needs it to call MCP tools. Experimental upstream; don't enable on an untrusted network.\nNot passed while the web UI is off; the choice is kept.\ndefault = on."
webui-mcp-toggle = "serve the web UI's MCP proxy endpoint"
log-level = "Log level"
log-level-hint = "llama-server log verbosity threshold (-lv / --log-verbosity): a message is printed when its own level is ≤ this one, so DEBUG:5 shows everything and OUTPUT:0 almost nothing.\nllama.cpp defines exactly these six levels; the number after the colon is what is passed to -lv.\nFramework default TRACE:4 records per-request logging into logs/llama-server.log; DEBUG:5 also logs the per-tensor override lines that tools\\report-memory.ps1 reads."
conversation-snapshots = "Conversation snapshots"
snapshots-intro = "Write each loaded model's KV cache to disk when the server stops, and push the newest one back on the next start. It buys back the one cost no VRAM tuning touches: reading a prompt is quadratic in its length and the cache dies with the process, so a restart re-reads the whole conversation. On a long prompt that prefill takes far longer than the sequential disk read that restores it. Off by default: every snapshot costs disk, as much as the KV cache it holds, stopping waits for the write, and the next start loads the model eagerly to push the state back in."
save-on-shutdown = "Save on shutdown"
save-on-shutdown-hint = "Dump the running conversation to the snapshot folder when llama-server stops (--slot-save-path plus a /slots save call), and restore it at the next start.\nOne file per loaded model, overwritten each time; dumps of models that are no longer loaded are pruned.\nWorth it for long agentic sessions, pointless for short prompts.\ndefault = off."
snapshot-toggle = "snapshot the KV cache on stop and restore it on start"
snapshot-folder = "Snapshot folder"
snapshot-folder-hint = "Where the dumps go. A snapshot is roughly one byte per byte of KV cache, and it scales with the tokens actually in the conversation, NOT with ctx-size (a model's guide gives its size per token). Since llama.cpp v0.7.0 the file also holds the context checkpoints and the draft model's state, so expect more on a hybrid model or with a drafter.\nThe default sits under %LOCALAPPDATA%, on the system drive; point it at a data disk if C: is tight.\nThe folder is created at launch: llama.cpp refuses to start on a --slot-save-path it cannot find."
snapshot-folder-placeholder = "folder for the KV-cache dumps"
sdk-tuning = "SDK Tuning"
sdk-tuning-intro = "Environment variables of the GPU vendor's own libraries, exported onto llama-server at launch (its per-model children inherit them). They are not llama.cpp flags: nothing validates them, and each one is read only by the backend it belongs to, inert on the others. The Command Line card below shows exactly what gets exported."
cuda-nothing-to-tune = "Nothing to tune. The cuBLAS path needs no environment workaround on the builds this framework ships."
hipblaslt-hint = "ROCBLAS_USE_HIPBLASLT: which of its two GEMM backends rocBLAS uses. Read by rocBLAS itself, so it rides the environment; there is no llama-server flag for it.\ndefault = don't set the variable: rocBLAS routes as it sees fit, which on RDNA4 means hipBLASLt for 16-bit GEMMs.\non forces hipBLASLt (=1); off forces Tensile (=0).\nSet it off on a Radeon AI PRO R9700 (gfx1201): hipBLASLt fails the SECOND 16-bit GEMM of a process there, so every BF16/F16 model aborts on its first prefill batch. Tensile runs them, where the older f32-compute workaround prefilled far slower. Upstream: ROCm issue #6461.\nYou may not need it at all: hipBLASLt only fails against the DRIVER's HIP runtime, the copy Windows loads from System32 in preference to anything on PATH. The installer puts ROCm's own runtime next to llama-server.exe, and the same GEMMs then pass with hipBLASLt on; only a build from source still runs the driver's.\nNo effect on CUDA or Vulkan builds."
flashattention-band = "FlashAttention band"
flashattention-band-hint = "GGML_HIP_FA_BAND_WMMA: a path of the framework's PATCHED ROCm backend, on by default. The 1-8 query FlashAttention (single-token decode and the MTP verify batch) of a head-256 model at GQA 5 to 12 (Qwen3.8-27B at 6, Qwen3.8-Flash-Next at 12) runs on the WMMA kernel, with the KV cache split round-robin over the compute units.\nThat attention gets faster and so does decode at depth; the Radeon AI PRO R9700 guide has the figures.\ndefault = 4, the one to use; 2 runs the same kernel but reads the KV cache twice as often at 3-4 queries; off = don't set the variable.\nNo effect on an unpatched llama.cpp, on GPUs older than RDNA4, on other head sizes or GQA ratios, on a KV cache other than f16 or q8_0, or on CUDA."
profiler-attach = "Profiler attach"
profiler-attach-hint = "ROCP_TOOL_ATTACH=1: lets rocprofv3 --attach <pid> (ROCm's profiler, in the TheRock dist) attach a kernel trace to the running llama-server. rocprofiler-sdk requires it of the process being profiled; without it the attach is refused.\nUnchecked = don't set the variable.\nNo effect on CUDA or Vulkan builds."
profiler-attach-toggle = "allow rocprofv3 --attach"
cuda-and-rocm = "CUDA and ROCm"
tensor-split-allreduce = "Tensor-split AllReduce"
tensor-split-allreduce-hint = "GGML_CUDA_ALLREDUCE: how split-mode tensor sums the partial results of the GPUs in the split. Read by the CUDA and the ROCm backend alike (one variable, one value for both), server-wide, and inert in every other split mode.\ndefault = don't set the variable: on Linux the collective library when the build links one (RCCL for ROCm devices), then the internal AllReduce; on Windows the internal one.\nnccl = the collective library (RCCL on ROCm; NCCL on CUDA only where the build found it).\ninternal = ggml's own AllReduce, staged through pinned host memory, so the slower card's PCIe link bounds it.\nnone = the generic reduction of llama.cpp's meta backend.\nSet it to none for a tensor split that MIXES a CUDA and a ROCm device: under any other value that model aborts while loading (measured on v0.6.0). On such a pair tensor then prefills well behind the layer split and decodes the same (the Radeon AI PRO R9700 guide has the figures)."
disable-gpu-graphs = "Disable GPU graphs"
disable-gpu-graphs-hint = "GGML_CUDA_DISABLE_GRAPHS=1: the CUDA and the ROCm backend stop replaying the decode step as a CUDA / HIP graph and launch its kernels one by one.\nA diagnostic switch: decode gets slower (graphs exist to amortize the launch overhead). Try it when decode crashes or produces garbage while prefill is fine, since only small batches take the graph path.\nUnchecked = don't set the variable (ggml tests its presence, so any value would disable graphs).\nNo effect on Vulkan builds."
disable-gpu-graphs-toggle = "launch kernels one by one"
kv-rotation = "KV rotation"
kv-rotation-hint = "LLAMA_ATTN_ROT_DISABLE=1: llama.cpp stops applying the Hadamard rotation it puts on a QUANTIZED K/V cache (the load logs a warning when it is off).\nThe rotation spreads outliers before quantizing, which is what keeps a q8_0 or q4_0 cache close to f16 quality. Turn it off only for a quality or speed A/B, or on a backend where it misbehaves.\nNo effect with an f16 / bf16 cache or with a head size that is not a multiple of 64; the DeepSeek-3.2/4, GLM-DSA and dots3note indexers rotate regardless.\nUnchecked = don't set the variable (rotation on)."
kv-rotation-toggle = "disable the KV-cache rotation"
