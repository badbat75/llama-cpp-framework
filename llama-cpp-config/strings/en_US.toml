saved-runs = "Saved runs"
database = "Database"
database-hint = "The SQLite file every finished run is written to, and the one listed below. Empty = bench\\bench.db under the data folder. Point it at a clone's benchmarks\\bench.db to record straight into the repo's database, with no bench publish; absolute paths are cut to file names and secret-like values dropped either way.\nA file that is not there yet is created by the first finished run. Enter, Browse… or Run saves the path to settings.ini (BenchDb), where bench run and bench query read it too."
