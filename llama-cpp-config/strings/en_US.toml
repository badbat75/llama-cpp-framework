startup = "Startup"
start-at-login = "Start at login"
start-at-login-hint = "Launches llama-cpp-config automatically when you log in.\nWindows: the per-user Run registry entry, the same one Task Manager's Startup apps panel manages. Linux: an autostart entry in ~/.config/autostart, which GNOME and the other desktops run at login.\nCombine it with the llama-server toggle below to bring the server up at login too.\nIf the app is moved or updated to a new location, re-tick this to refresh the stored path."
start-at-login-toggle = "launch llama-cpp-config at login"
start-minimized = "Start minimized"
start-minimized-hint = "How the login launch above comes up: minimized to the system tray (recommended: nothing opens over your session, the tray icon is the handle), or as the open configurator window.\nOnly applies to the 'Start at login' launch; starting the app yourself always opens the window."
start-minimized-toggle = "start minimized to the system tray at login"
start-llama-server = "Start llama-server"
start-llama-server-hint = "Starts llama-server automatically whenever llama-cpp-config launches: any launch, not just the login one.\nUses the same start path as the Start button (a failure shows in the footer, and View logs has the details). Does nothing when the server is already running."
start-llama-server-toggle = "start llama-server when llama-cpp-config launches"
logging = "Logging"
rotate-the-log = "Rotate the log"
rotate-the-log-hint = "When llama-server stops, logs\\llama-server.log is filed away as llama-server-<date>-<time>.log (the closing instant, UTC) and the next run starts in a clean file. The newest 10 closed logs are kept.\nA run that ended without a Stop (a crash, a driver reset, an external kill) is filed at the next start under its last-write time instead.\nOff = one file growing forever, the behaviour before 1.15.1."
rotate-log-toggle = "file the log away when llama-server stops"
only-above = "Only above"
only-above-hint = "Only a log LARGER than this many KB is filed; a shorter one stays and the next run appends below it, so a handful of short runs share one file instead of leaving one file each.\n0 files every non-empty log. Applies on Enter or when the field loses focus."
split-tensor-needs-flash-attention = "Split mode tensor requires flash attention: with Flash attention off, llama.cpp refuses to create the context and the model does not load. Set it to on or default."
split-tensor-no-gpu = "Split mode tensor with no GPU checked: llama.cpp then pools EVERY detected device into the split, duplicate Vulkan views of the same card and the iGPU included. Check the GPUs to run on."
split-tensor-mixed-backends = "Split mode tensor across a CUDA and a ROCm device: the model aborts while loading unless Server tab > SDK Tuning > Tensor-split AllReduce is set to none. Even then, expect about half the prefill speed of the layer split."
