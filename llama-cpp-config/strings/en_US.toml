kv-no-kernel-vulkan = "{0}: Vulkan's FlashAttention needs bf16 on both K and V or on neither (K {1} / V {2}), and {3}."
kv-no-decode-kernel = "{0}: this build has no native FlashAttention decode kernel for K {1} / V {2} on CUDA and ROCm, so every decode step of 1-2 tokens converts the whole used cache to f16 first (slower decode). Native pairs, K and V equal: f16, bf16, q8_0, q5_1, q5_0, q4_0."
