# What a CLI command reads, and only that: the messages the CLI shares with the
# GUI, under the same keys as the language files. Not a language and never
# translated: editing a language file cannot change CLI output. Text only the CLI
# prints is not here, it is literal in src/cli.rs. src/tests/binding_lint.rs keeps
# the keys in step with the sources a CLI command reaches.

