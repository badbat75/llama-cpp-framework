[package]
name = "pai-bff"
version.workspace = true
edition = "2021"
description = "pai-bff: the backend-for-frontend service of the Private AI Framework"
license = "MIT"
publish = false

# The modules live in the library, the binary only calls `bff::main`. Its doc
# comments are not doctests: none was written as one.
[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "pai-bff"
path = "src/main.rs"

[dependencies]
# The modules shared with pai-manager and the configurator (paths, INI,
# strings).
pai-core = { path = "../core" }
# The HTTP service (lib.rs `router`, `bff::run`). Current stable on crates.io;
# its default features include the tokio server (`axum::serve`) and JSON.
axum = "0.8.9"
# axum's runtime; the version already in the lock. `signal` for the graceful
# stop on SIGTERM and Ctrl-C, `sync` for the Windows service's stop control
# (serve.rs), `time` for the deadline on the manager (lib.rs `instances`).
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
# The `/api/version` body; axum's `json` feature already links it.
serde_json = "1"
# The random bytes of this crate (session.rs's session ids, lib.rs's revision
# secret): the OS's source, as std has no stable one; the version already in
# the lock. `std` for `std::io::Error: From<getrandom::Error>`, which is how
# the missing bytes reach `ServeError` and the error line.
getrandom = { version = "0.3.4", features = ["std"] }
# The server file's revision (server.rs): SipHash-2-4, keyed by the secret
# drawn above; the version already in the lock.
siphasher = "1.0.4"

# This machine's own names (listen.rs): `gethostname(2)`, there being no file
# that is the host name; the version already in the lock (pai-manager's
# accounts).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["hostname"] }

# `pai-bff service` under the Windows service dispatcher (serve.rs), as
# pai-manager's services, and the machine's DNS host name and domain
# (`GetComputerNameExW`, listen.rs).
[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
pai-core = { path = "../core", features = ["test-support"] }
# The router is tested without a socket: `ServiceExt::oneshot` hands it one
# request, http-body-util reads the body back (tests/router.rs).
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
# The instances tests put a deadline on each answer (tests/instances.rs).
tokio = { version = "1.54", features = ["time"] }
serde_json = "1"
tempfile = "3"
