[package]
name = "pai-manager"
version.workspace = true
edition = "2021"
description = "pai-manager: runs llama-server instances as services"
license = "MIT"
publish = false

# The modules live in the library, the binary only calls `manager::main`. Its
# doc comments are not doctests: none was written as one.
[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "pai-manager"
path = "src/bin/pai-manager.rs"

[dependencies]
pai-core = { path = "../core" }
# The manager's protocol over a byte stream (manager/pipe.rs): one JSON
# message per frame, the frames pai-core's client writes.
serde_json = "1"

# pai-manager's D-Bus service on the system bus (manager/dbus.rs). The
# version already in the lock (accesskit, atspi, ashpd), so there is one zbus;
# 5.x keeps the blocking API the synchronous core needs.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"
# Runs each D-Bus method's blocking core call off the connection's executor
# thread (manager/dbus.rs); the version zbus already pulls into the lock.
blocking = "1.7"

# The Windows services (manager/windows/scm.rs, manager/windows/serve.rs):
# the SCM's dispatcher, control handler and service configuration, and the
# raw Win32 calls it has no wrapper for (the named pipe and its security
# descriptor, the client's token, the service list).
[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[dev-dependencies]
pai-core = { path = "../core", features = ["test-support"] }
tempfile = "3"

# The D-Bus interface's tests serve it over a peer-to-peer connection on a
# Unix socket pair, never a bus (manager/dbus.rs).
[target.'cfg(target_os = "linux")'.dev-dependencies]
# `bus-impl` lets the client end name itself, so its calls carry a sender as
# they would from the bus; serde is for the generic call helper.
zbus = { version = "5.19", features = ["p2p", "bus-impl"] }
serde = "1"
