[package]
name = "pai-core"
version.workspace = true
edition = "2021"
description = "Shared library of private-ai-framework: paths, INI and server config, the llama-server launch, strings"
license = "AGPL-3.0-or-later"
publish = false

# Its doc comments are not doctests: none was written as one.
[lib]
path = "src/lib.rs"
doctest = false

# `test-support`: the helpers the other crates' tests use (`paths::os_path`) and
# the strings table a test reads (the GUI's file over `cli.toml`). Their
# dev-dependencies turn it on; no shipped build has it. It carries `tempfile`:
# a crate that turns the feature on does not see the dev-dependency, and
# `isolated` makes its child's data root with it.
[features]
test-support = ["dep:tempfile"]

[dependencies]
if-addrs = "0.15"
tempfile = { version = "3", optional = true }
# The language files (strings.rs).
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# The manager's protocol over a byte stream (client/pipe.rs): one JSON message per frame.
serde_json = "1"

# The manager's D-Bus client (client/dbus.rs): the zbus pai-manager serves with.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

# `O_NONBLOCK` on the open of a model file (gguf_shape.rs): the `fs` feature
# for its `fcntl::OFlag`. The kernel's release (host.rs): the `feature` feature
# for `sys::utsname::uname`. The kill of a hung test child's whole process
# group (isolated.rs): the `signal` feature for `sys::signal::killpg`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "feature", "signal"] }

# The Win32 calls of proc.rs (the std handles a child must not inherit) and
# of the manager's pipe client (client/pipe.rs: `WaitNamedPipeW`), the
# engine's registration (paths.rs: `RegGetValueW`), and the host
# (host.rs: `GlobalMemoryStatusEx`, `RtlGetVersion`, and the display devices
# through Configuration Manager).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3"
