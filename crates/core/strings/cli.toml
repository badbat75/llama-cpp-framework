# What a CLI command reads, and only that: the text the CLI prints, in English.
# Not a language and never translated: editing a language file cannot change CLI
# output. A message the GUI shows too has the same key in en_US.toml (the text there
# may differ); the rest are here alone. --help stays in src/cli.rs, and so does what
# has no language. src/tests/binding_lint.rs keeps the keys in step with the sources
# a CLI command reaches and fails on a new literal in them.

