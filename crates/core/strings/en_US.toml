logging = "Logging"
rotate-the-log = "Rotate the log"
rotate-the-log-hint = "When llama-server stops, files its log (logs/llama-server.log) away as llama-server-<date>-<time>.log, in UTC, if it is larger than Only above, and the next run starts in a clean file. The newest 10 are kept.\nA run that ended without a Stop (a crash, a driver reset, an external kill) is filed at the next start under its last-write time.\nOff = one file that keeps growing."
