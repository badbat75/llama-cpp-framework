assets = "Assets"
model-file = "Model file"
model-file-hint = "The model this preset runs: a .gguf from the models subfolder of your Models folder.\nFlag: --model"
project-url = "Project URL"
project-url-hint = "The model's project page, such as its Hugging Face repository. Open shows it in your browser.\nSaved as a comment in the preset: llama-server does not use it."
mmproj-hint = "Lets a vision model read images: the multimodal projector (mmproj) file that goes with the model.\nLeave blank for a text-only model.\nFlag: --mmproj"
draft-model = "Draft model"
draft-model-hint = "An optional small, fast model that drafts tokens ahead for the main model to check, which can speed up generation.\nPicking one sets Drafter from the file's header (or its folder when the header does not tell) and, if Draft device is empty, pins the draft to one of this preset's GPUs, or to the CPU if none is checked. Ticked N-gram drafters stay.\n(none) = no draft model. Keep (none) when the main model has built-in MTP heads: those only need Drafter.\nFlag: --model-draft"
drafter-hint = "Which kind of draft this preset uses. It is set for you when you pick a draft model, from that file's header; change it only if you know you need another. The wrong kind gives no error: every draft is rejected, so you pay for drafting and gain nothing.\nNeeds a draft model or MTP heads built into the main model; without either, only none is offered.\nFlag: --spec-type (the draft-* entry)"
n-gram-drafters = "N-gram drafters"
n-gram-drafters-hint = "Drafters that need no extra model: they predict from the tokens already in the conversation, which pays off when the output repeats it (code edits, quotes, refactors). Tick any number. llama.cpp tries them first and uses the draft model when none matches.\nTheir settings are under Speculative decoding below.\nFlag: --spec-type (the ngram-* entries)"
model-info = "Model info"
type = "Type"
type-hint = "Dense: every weight works on every token. MoE (Mixture of Experts): only a few experts work on each token, so the model needs VRAM for all its weights but the compute of just the active experts.\nOn a MoE model, 'MoE CPU layers' below can free VRAM; on a dense model, 'Dense FFN CPU layers' does."
moe-layers = "MoE layers"
moe-layers-hint = "How many layers hold experts: the useful upper limit for 'MoE CPU layers' below (its slider runs to the total layer count). Moving more of them to the CPU frees VRAM but slows generation."
arch-quant = "Arch / quant"
embeddings = "Embeddings"
embeddings-hint = "The quantization and size of the model's embedding table, read from the file: its name does not tell (different quantizations of one model can differ here).\nIt decides whether a Tensor placement rule below may put the table on a GPU. Most types can (IQ4_NL and MXFP4 only when the embedding width is a multiple of 256). Q8_1, Q8_K, the ternary TQ types and NVFP4 cannot: the table then goes back to host RAM on every token, and generation collapses.\nThe size is the VRAM such a rule adds to that card. Budget it against the KV cache, or the card starts paging."
layers-ctx = "Layers / ctx"
layers-ctx-hint = "How many layers the model has, which is what GPU layers counts, and the context it was trained with, the sensible upper limit for Context size (going higher needs RoPE scaling)."
attention = "Attention"
attention-hint = "The model's attention head counts. Fewer KV heads (GQA) shrink the KV cache, so a larger Context size fits in the same VRAM."
memory = "Memory"
memory-hint = "How the model keeps past tokens: a KV cache (attention), a fixed-size state (recurrent), or both (hybrid).\nA recurrent state cannot be rewound, so recurrent and hybrid models reuse the start of a prompt only through checkpoints (see Context checkpoints). With attention alone, the KV cache is simply cut back.\nRead from the architecture."
chat-template = "Chat template"
chat-template-hint = "Whether the model file holds a chat template, which formats conversations for the model.\nJinja (embedded) = llama-server uses it automatically.\nembedded (non-Jinja) = an older form; it may need a named template, or the embedded-template box unticked.\nnone = no template in the file: one must be supplied.\nFlags: --chat-template, --chat-template-file, --no-jinja"
thinking = "Thinking"
thinking-hint = "Whether the embedded chat template supports thinking, and whether the Reasoning setting can switch it. On a template that never mentions the switch, the setting changes nothing.\nThis reads the template, not the model: 'no marker in the chat template' does not prove the model cannot think, only that Reasoning and Keep past thinking have nothing to act on here."
past-thinking = "Past thinking"
past-thinking-hint = "Whether 'Keep past thinking' does anything on this model. A template that does not read that setting ignores it.\nllama-server's log cannot tell you this: its 'supports preserving reasoning' line also appears for a template that always preserves, which you cannot control."
selected-mmproj-hint = "The selected multimodal projector (mmproj): its type, what it reads (vision, audio), encoder depth, and native image and patch size."
draft = "Draft"
draft-hint = "What really drafts for this preset: MTP heads built into the model, plus the draft file picked in the Assets card above (the row below reads that file).\nA drafter in your folders that this preset does not point at does not appear here: choose one in Draft model above.\nnone = no built-in heads and no draft file: this preset does not speculate."
draft-file = "Draft file"
draft-file-hint = "What the selected draft file's header says: architecture, quantization, layers and, for DFlash, the trained block size, which limits Draft n-max."
no-model-selected = "Select a model to see its GGUF details."
gpu-distribution = "GPU distribution"
gpu-distribution-intro = "Which GPUs run THIS model and how much each holds, saved to presets.ini. Check nothing to let llama.cpp choose. With two GPUs of different sizes, check both and give the bigger one more; left blank, the split follows free VRAM, not an even cut. In layer mode the column counts blocks (the model's layers) once the model's header is read, and each row says which ones it gets; the last position is the output layer, not a block. Drag a slider to move the cut: the other rows adjust when you let go. The checked rows, top to bottom, are the split order: drag ≡ to reorder; the first one is llama.cpp's main GPU.\nKeys: split-mode, device, tensor-split."
clear = "Clear"
split-mode-hint = "How THIS model is divided between GPUs. Does nothing with one GPU checked. Same on CUDA and ROCm.\nlayer (default): each GPU takes a consecutive run of blocks, and the table edits the cut. Fastest prefill; copes with a slow link between GPUs.\nnone: one GPU, the first checked row; other checked rows go unused.\ntensor (experimental): the GPUs act as one device, and all weights and the KV cache are divided by the ratio (blank = even). Fastest decode, needs a fast link. Flash attention must not be off, Fit to VRAM is skipped (set Context size yourself), some architectures refuse to load, and llama.cpp tunes it for CUDA with no guarantees on other backends.\nrow (deprecated, use tensor): weights are split by rows by the ratio (CUDA/ROCm; Vulkan falls back to layer). The KV cache follows the layer cut.\nFlag: --split-mode"
tensor-placement = "Tensor placement"
tensor-placement-intro = "Exceptions to the table above: tensors that go on a device of their own, whatever their layer does. The most useful one: llama.cpp keeps the embedding table in RAM even when it reports every layer on the GPU (Windows shows it as \"Shared GPU memory\"). Put it on a GPU to reclaim that memory, if the card has room, or send big tensors to the CPU to free VRAM. The first matching rule wins.\nFlag: --override-tensor"
hardware-config = "Hardware config"
gpu-layers = "GPU layers"
gpu-layers-hint = "How many of the model's layers run on the GPU. The rest stay on the CPU: less VRAM, slower.\nSlider maximum = all layers.\nDefault: all layers on the GPU. A model too big for it fails to load, unless Fit to VRAM is on.\nFlag: --n-gpu-layers"
moe-cpu-layers = "MoE CPU layers"
moe-cpu-layers-hint = "Frees VRAM by keeping the experts of this many layers on the CPU; generation gets slower. Only for MoE models: on a dense model use 'Dense FFN CPU layers' below.\nSlider maximum = the model's layer count.\nDefault: 0, every expert stays on the GPU with its layer.\nFlag: --n-cpu-moe"
moe-cache = "MoE cache (MiB)"
dense-ffn-cpu-layers = "Dense FFN CPU layers"
dense-ffn-cpu-layers-hint = "Frees VRAM by keeping the feed-forward weights (most of a layer's size) of the first N layers on the CPU; attention stays on the GPU. For dense models: on a MoE model it reaches only the dense layers such a model may have, never the experts.\nSlider maximum = the model's layer count.\nDefault: every feed-forward weight stays on the GPU with its layer.\nFlag: --n-cpu-ffn"
op-offload = "Op offload"
op-offload-hint = "Whether work on weights kept in RAM is still sent to the GPU. Worth trying when experts or other tensors are in RAM and the card sits on a narrow PCIe link: off then prefills faster, because those weights are no longer copied to the card on every prefill batch (the Qwen3.8-Flash-Next guide has the figures). Decode does not change.\nDefault: on (llama.cpp's own); off is the one value that changes anything. No effect when every weight is in VRAM.\nFlags: --op-offload, --no-op-offload"
repack = "Repack"
repack-hint = "When loading, rearranges weights kept in RAM into the layout the CPU's fast kernels use, for the types it has them for (x86 AVX2: Q4_0, Q4_K, IQ4_NL, MXFP4; Q2_K with AVX-512).\nOnly matters without a GPU, or with No host buffer on: with a GPU, weights in RAM go to its host buffer and this does nothing.\nDefault: on (llama.cpp's own); off is the one value that changes anything. No effect when no weight is in RAM.\nFlags: --repack, --no-repack"
no-host-buffer = "No host buffer"
no-host-buffer-hint = "Keeps weights left in RAM in ordinary memory instead of the GPU's pinned host buffer (RAM locked in place, which the GPU reads directly).\nOff (default, llama.cpp's own): pinned.\nOn: ordinary, pageable RAM, and the CPU repacks the types it can (see Repack). The copies Op offload makes then come from pageable memory, and repacked experts leave the MoE cache.\nNo effect when no weight is in RAM.\nFlag: --no-host"
lazy-tensors = "Lazy tensors"
lazy-tensors-hint = "Saves RAM on models with very large tables: reads them from disk as needed, a row per token, instead of keeping them in memory. Only a few architectures have such tables (such as gemma4 and qwen4exp); no effect on others. Keep the GGUF on an SSD.\nDefault: auto (llama.cpp's own): lazy only for a table over 4 GiB, and off if one of the model's devices cannot memory-map (an integrated GPU).\non = lazy whatever the size and the devices; off = always in RAM (no disk reads, but all of the RAM).\nWorks whatever Load mode says.\nFlag: --lazy-mode"
load-mode = "Load mode"
load-mode-hint = "How this model's weights get into memory. Pick one: the modes do not combine.\nDefault: auto (llama.cpp's own).\nauto: memory-maps the file (reads it on demand) unless a device can't; fastest to load.\nnone: reads the weights into RAM up front: slower, uses the model's size in RAM, but nothing can be dropped back to the file.\nmmap: always memory-maps.\nmlock: locks the weights in physical RAM WITHOUT memory-mapping: steady latency, needs room for the whole model.\nmmap+mlock: memory-maps and locks what it maps.\ndio: Direct I/O where the platform offers it.\nLazy tensors stay mapped whatever this says.\nFlag: --load-mode"
fit-to-vram = "Fit to VRAM"
fit-to-vram-hint = "Lets llama.cpp pick the context size and GPU layers that fit your GPU memory, leaving about 1 GiB free on each GPU.\nAvailable only with Context size and GPU layers at default. Off by default here, though llama.cpp's own default is on.\nWhen on, also leave tensor-split, Tensor placement, MoE CPU layers and Dense FFN CPU layers empty: with any of them llama.cpp fits only the context (the log warns), which can over-fill one card.\nFlag: -fit"
fit-allowed = "auto-fit context and layers to device memory (-fit on)"
fit-not-allowed = "needs Context size and GPU layers at default"
fit-min-context = "Fit min context"
fit-min-context-hint = "The smallest context Fit to VRAM may cut down to. Only used with Fit to VRAM on.\nDefault: 4096 (llama.cpp's own).\nFlag: --fit-ctx"
fit-free-vram = "Fit free VRAM (MiB)"
fit-free-vram-hint = "How much VRAM Fit to VRAM leaves free, in MiB: one number for every device, or a comma-separated list in device order (such as 2048,1024). Only used with Fit to VRAM on.\nBlank = 1024 per device (llama.cpp's own).\nFlag: --fit-target"
embedded-mtp-note = "This model has built-in MTP heads: the draft runs inside the main model's context, on the model's own GPU. Draft device and Draft GPU layers apply only to a separate draft model file, so they stay disabled here."
draft-device = "Draft device"
draft-device-hint = "The GPU for a separate draft model file. Pin it to ONE device: MTP heads crash on an automatic multi-GPU split.\nA full-vocabulary DFlash or DSpark drafter under a layer split must sit on the GPU with the last layers, or it aborts at load; picking the file pins it there for you.\nDisabled with built-in MTP heads, which share the main model's GPU.\nBlank = automatic, same as the model.\nFlag: --device-draft"
draft-gpu-layers = "Draft GPU layers"
draft-gpu-layers-hint = "How many layers of a separate draft model file run on the GPU.\nA drafter with real layers (such as DFlash) gets a slider from 0 to its layer count. An MTP head file has no layers, so it gets a CPU/GPU switch.\nPin a device above: MTP heads crash on an automatic multi-GPU split.\nDisabled with built-in MTP heads.\nDefault: all draft layers on the GPU.\nFlag: --n-gpu-layers-draft"
resource-context = "Resource / context"
context-size = "Context size"
context-size-hint = "How many tokens of conversation the model can hold. Bigger = longer history, more VRAM for the KV cache. It can be divided among requests: see Parallel slots.\nDefault: 0 (llama.cpp's own), meaning the context the model was trained with, which can be far more than the number shown here.\nFlag: --ctx-size"
parallel-seqs = "Parallel slots"
parallel-seqs-hint = "How many requests can run at once. A number you set DIVIDES the context among them: 2 leaves each request half of Context size.\nDefault: auto (llama-server's own), 4 slots sharing one KV cache, so one request can use the WHOLE context. Leave it at default to give one request the model's full context.\nFlag: --parallel"
unified-kv = "Unified KV"
unified-kv-hint = "One KV cache shared by all parallel slots, so any request can grow into the WHOLE context instead of its own share.\nOn pays off when requests are uneven (one long, others short). Off gives each slot a fixed share, so one long request cannot starve the others.\nDefault: off with Parallel slots set. With Parallel slots at default, llama-server turns it on anyway, so this is disabled.\nFlags: --kv-unified, --no-kv-unified"
per-slot-context = "Per-slot context"
per-slot-context-hint = "Limits every slot to this many tokens. Works with Unified KV on or off.\nWith Context size at default it also sizes the KV cache as Parallel slots × this value, instead of the model's trained context: 4 slots at 32768 allocate 128k tokens.\nDefault: no limit.\nFlag: --kv-unified-per-slot"
batch-size = "Batch size"
batch-size-hint = "How many tokens of a prompt are handled per step. Higher speeds up prefill (reading the prompt) and uses more VRAM.\nDefault: 2048 (llama.cpp's own).\nFlag: --batch-size"
u-batch-size = "U-Batch size"
u-batch-size-hint = "How many tokens are actually computed at once. Must not exceed Batch size.\nDefault: 512 (llama.cpp's own).\nFlag: --ubatch-size"
embedding-mode = "Embedding mode"
embedding-mode-hint = "Serves this model as an embedding model, turning on /v1/embeddings (without it, llama-server answers 501 \"This server does not support embeddings\"). Only for dedicated embedding models.\nEvery input must fit in one batch: set Batch size and U-Batch size above to at least your longest text, or the request fails with \"input is too large\" (U-Batch size defaults to 512 tokens).\nDefault: off.\nFlag: --embeddings"
pooling = "Pooling"
pooling-hint = "How a text's token vectors become ONE embedding. Only used in embedding mode.\nDefault: the model's own, read from its GGUF.\nnone = one vector per token; mean = their average; cls = the first token's; last = the last token's (Qwen3-Embedding); rank = the reranker head.\nA wrong choice gives no error, only vectors of the right size that search worse.\nFlag: --pooling"
kv-cache = "KV cache"
k-cache-type = "K-cache type"
k-cache-type-hint = "Compresses the K half of the KV cache. Lower types use less VRAM but reduce quality.\nDefault: f16 (llama.cpp's own).\nFlag: --cache-type-k"
v-cache-type = "V-cache type"
v-cache-type-hint = "Compresses the V half of the KV cache. Lower types use less VRAM but reduce quality; usually set to match K.\nA quantized V needs flash attention: with Flash attention off, the model does not load.\nDefault: f16 (llama.cpp's own).\nFlag: --cache-type-v"
flash-attention = "Flash attention"
flash-attention-hint = "A faster attention method: faster prefill and less KV memory.\nDefault: auto (llama.cpp's own): on wherever the backend supports it.\non forces it. off disables it, which loses most of the gain of a quantized K cache and stops a quantized V cache from loading.\nFlag: --flash-attn"
cache-ram = "Cache RAM (MiB)"
cache-ram-hint = "How much RAM may hold past prompts for reuse, in MiB, so they need not be read again. Context checkpoints count against it: on a large hybrid model with long prompts and several slots, old prompts are dropped sooner than their KV size suggests.\nDefault: 8192 MiB (llama.cpp's own). 0 = off, -1 = no limit.\nFlag: --cache-ram"
cache-reuse = "Cache reuse"
cache-reuse-hint = "Lets a new prompt reuse matching pieces of the cached one by shifting the KV cache, instead of reading them again. The value is the smallest piece worth reusing, in tokens.\nDefault: 0, off (llama.cpp's own). llama.cpp also turns it off, with a warning in the log, on a model with an mmproj and on one whose cache cannot shift.\nFlag: --cache-reuse"
context-checkpoints = "Context checkpoints"
context-checkpoints-hint = "How many saved states (checkpoints) each slot keeps, so a prompt that changes partway need not be read again from the start. Matters on recurrent, hybrid and SWA models (Qwen3.5/3.8, qwen4exp, Mamba, Jamba...), which cannot rewind: without checkpoints they read the whole prompt again. No effect on a pure-attention model.\nEach checkpoint is a copy of that state in RAM; the oldest is dropped once the slot holds this many.\nDefault: 32 (llama.cpp's own). 0 = off.\nFlag: --ctx-checkpoints"
checkpoint-step = "Checkpoint step"
checkpoint-step-hint = "The minimum distance between two checkpoints, in tokens. Smaller = a changed prompt resumes closer to the change, but more checkpoints use more RAM (those of a cached prompt also count against Cache RAM).\nDefault: 8192 (llama.cpp's own). 0 = no minimum.\nFlag: --checkpoint-min-step"
chat-reasoning = "Chat / reasoning"
use-chat-template-hint = "Uses the chat template embedded in the model to format conversations, instead of built-in guesses. Recommended on, for correct tool calls and roles.\nFlag: --jinja"
use-chat-template = "use embedded chat template (--jinja)"
prefill-assistant = "Prefill assistant"
prefill-assistant-hint = "What to do when a request ends with an assistant message.\nOn (default, llama.cpp's own): treat it as the start of the reply and continue it, so a client can seed the answer's opening.\nOff: treat it as a finished turn and answer it. Turn it off if a client ends on an assistant turn and the model resumes mid-sentence instead of replying.\nFlags: --prefill-assistant, --no-prefill-assistant"
prefill-assistant-toggle = "continue a trailing assistant message (--prefill-assistant)"
reasoning = "Reasoning"
reasoning-hint = "Whether the model thinks before answering.\nauto (recommended): follows the model's template.\non: force thinking.\noff: disable it.\nFlag: --reasoning"
reason-format = "Reasoning format"
reason-format-hint = "How thinking is delivered to the client.\nauto = let the template decide.\ndeepseek = thinking goes in a separate channel, apart from the answer.\nnone = left inline in the answer.\nFlag: --reasoning-format"
reasoning-effort = "Reasoning effort"
reasoning-effort-hint = "How hard the template asks the model to think: a level handed to the chat template, neither an on/off switch nor a token limit.\nDefault: whatever the template does on its own.\nOnly some templates read it (gpt-oss and harmony do, most do not); the others ignore it silently, and llama-server's log does not say. The Thinking row in Model info is the place that tells you.\nSet it here, not in Chat kwargs below: this one setting binds both names templates use (reasoning_effort, reasoning_strength), and a hand-written one sets only one of them.\nFlag: --reasoning-effort"
keep-past-thinking = "Keep past thinking"
keep-past-thinking-hint = "Sends the thinking of EVERY past assistant turn back to the model, not just the last one. It costs prompt tokens: the thinking is re-sent every turn.\nDefault: on (llama.cpp's own). on pins it; off drops it, the one value that changes anything.\nOnly works where the template supports it: llama-server says so in its log at startup.\nUse this, not preserve_thinking or preserve_reasoning in Chat kwargs below: templates read different names, so a hand-written one usually does nothing.\nFlags: --reasoning-preserve, --no-reasoning-preserve"
output-budget-note = "The next three split one output budget in two. Thinking budget limits the thinking alone; Max output limits thinking and answer together, so the answer gets what the thinking leaves. Do not copy a model card's numbers as they are: they assume a certain context, and a budget larger than your context never takes effect."
thinking-budget = "Thinking budget"
thinking-budget-hint = "The most tokens the model may spend thinking. Pick it by how long you are willing to wait.\n-1 = no limit, 0 = end thinking immediately, N > 0 = that many tokens.\nDefault: -1 (llama.cpp's own).\nAt the limit llama.cpp closes the thinking block for the model, which still writes a normal answer. Only works where the template declares thinking tags.\nFlag: --reasoning-budget"
budget-message = "Budget message"
budget-message-hint = "Text added just before thinking is closed at the budget, to steer the model into wrapping up instead of stopping mid-thought. Write it in the language the model answers in: another language invites mixed replies.\nBlank = no message (llama.cpp's own default).\nNo ';' or '#': the INI format cannot escape them, and the value would reload truncated.\nFlag: --reasoning-budget-message"
budget-message-placeholder = "e.g. Budget reached, write the final answer now."
max-output = "Max output"
max-output-hint = "The most tokens one request may generate, thinking and answer together, for clients that do not set their own limit.\n-1 = keep going until the context is full.\nDefault: -1 (llama.cpp's own).\nNot a hard limit: a client's own max_tokens always wins, higher or lower.\nFlag: --n-predict"
sampling-overrides = "Sampling overrides"
sampling-temperature-hint = "How adventurous the output is. Lower = more predictable, higher = more creative.\nDefault: 0.80 (llama.cpp's own).\nFlag: --temp"
top-k-hint = "Considers only the K likeliest next tokens. 0 = off.\nDefault: 40 (llama.cpp's own).\nFlag: --top-k"
top-p-hint = "Considers only the smallest set of likely tokens whose probabilities add up to P (such as 0.95).\nDefault: 0.95 (llama.cpp's own).\nFlag: --top-p"
min-p-hint = "Drops tokens less likely than this fraction of the likeliest one.\nDefault: 0.05 (llama.cpp's own).\nFlag: --min-p"
repeat-penalty = "Repeat penalty"
repeat-penalty-hint = "Above 1 discourages repeating recent tokens (such as 1.1).\nDefault: 1.0, off (llama.cpp's own).\nFlag: --repeat-penalty"
presence-penalty = "Presence penalty"
presence-penalty-hint = "Positive values discourage any token already seen, pushing toward new topics.\nDefault: 0.0, off (llama.cpp's own).\nFlag: --presence-penalty"
backend-sampling = "Backend sampling"
backend-sampling-hint = "Experimental: picks the next token on the GPU that holds the model's output, instead of copying that output to the CPU first.\nOnly some samplers can run there (greedy, dist, top-k, top-p, min-p, temp, penalties, logit-bias). Any other in the chain (typical, xtc, mirostat, top-n-sigma, dry, adaptive-p) silently sends the WHOLE chain back to the CPU.\nTurned off by a grammar or JSON schema, by a Thinking budget, and by split mode tensor. A request asking for pre-sampling probabilities uses the CPU for that request.\nDefault: off (llama.cpp's own); on is the one value that changes anything. An MTP or DFlash drafter already samples on the GPU, whatever this says.\nFlag: --backend-sampling"
advanced = "Advanced"
load-on-startup = "Load on startup"
load-on-startup-hint = "Loads this model as soon as the server starts, instead of on its first request. Read only at startup: a preset added while the server runs is loaded on demand.\nThe server refuses to start when more presets load on startup than ModelsMax allows, and with ModelsMax = 0 whenever any does, so Save refuses that too.\nKey: load-on-startup (preset only, no command-line flag)"
chat-kwargs = "Chat kwargs"
chat-kwargs-hint = "Extra values passed to the chat template, as JSON, such as {\"enable_thinking\":true}.\nAdvanced: leave blank unless the model's documentation lists them.\nFlag: --chat-template-kwargs"
vision = "Vision"
vision-on-gpu = "Vision on GPU"
vision-on-gpu-hint = "Runs the image encoder (mmproj) on the GPU. On (default, llama.cpp's own), it holds VRAM as long as the model is loaded but only works on image requests. Off: slower image encoding, no VRAM.\nWhich GPU: see 'Vision GPU' below.\nFlags: --mmproj-offload, --no-mmproj-offload"
vision-offload-toggle = "offload the image encoder to GPU"
vision-gpu = "Vision GPU"
vision-gpu-hint = "The GPU the image encoder runs on.\nDefault: the first GPU in this preset's device list; with no device checked, the first GPU llama.cpp finds, which on a mixed machine is often not the one running the model. It holds VRAM there and stays idle until an image arrives.\nName a device to override both.\nFlag: --mmproj-device"
image-tokens-note = "The two limits below set how many tokens ONE image takes on dynamic-resolution vision models. They apply only with an MMProj picked above. Leave them at default to read the limit from the model."
min-image-tokens = "Min image tokens"
min-image-tokens-hint = "The fewest tokens each image is encoded to, on vision models with dynamic resolution.\nDefault: read from the model.\nFlag: --image-min-tokens"
max-image-tokens = "Max image tokens"
max-image-tokens-hint = "The most tokens each image is encoded to, on vision models with dynamic resolution. Lower it to limit the prefill cost and VRAM of large images.\nDefault: read from the model.\nFlag: --image-max-tokens"
speculative-decoding = "Speculative decoding"
draft-model-group = "Draft model (draft-mtp, draft-dflash, draft-dspark, draft-simple)"
draft-n-max = "Draft n-max"
draft-n-max-hint = "The most tokens a draft proposes per step. DFlash limits this to the size it was trained for, minus one (the Draft file row shows it).\nDefault: 3 (llama.cpp's own).\nFlag: --spec-draft-n-max"
draft-p-min = "Draft p-min"
draft-p-min-hint = "How sure the drafter must be, 0 to 1. Drafting stops at the first token below this, so the model checks a shorter batch instead of tokens it would reject.\nDefault: 0, never stops early (llama.cpp's own).\nFlag: --spec-draft-p-min"
draft-n-min = "Draft n-min"
draft-n-min-hint = "The shortest draft worth checking. A shorter one, usually cut by Draft p-min, is thrown away, and that step generates one token normally. Raise it when short drafts cost more to check than they save.\nDefault: 0, keeps any length (llama.cpp's own).\nFlag: --spec-draft-n-min"
draft-n-ubatch = "Draft n-ubatch"
draft-n-ubatch-hint = "How many tokens the draft computes at once. Smaller spares VRAM, at the cost of more passes when the drafter catches up on a long prompt. Applies to built-in MTP heads too.\nDefault: 0, the model's U-Batch size (llama.cpp's own).\nFlag: --spec-draft-n-ubatch"
draft-cache-note = "The draft keeps its OWN KV cache, which does not follow the model's: it stays at f16 unless you set it here. Quantize it to reclaim VRAM. Unlike the placement settings above, these two also apply to MTP heads built into the main model."
draft-k-cache-type = "Draft K-cache type"
draft-k-cache-type-hint = "Compresses the K half of the draft's KV cache. A draft context is small, so this matters most with a separate draft model and a large context.\nDefault: f16, NOT the model's K-cache type.\nFlag: --spec-draft-type-k"
draft-v-cache-type = "Draft V-cache type"
draft-v-cache-type-hint = "Compresses the V half of the draft's KV cache. Usually matched to Draft K-cache type. A quantized V needs flash attention.\nDefault: f16, NOT the model's V-cache type.\nFlag: --spec-draft-type-v"
match-length = "Match length"
match-length-hint = "How many recent tokens must match before a draft is proposed. Below 16, llama.cpp warns that drafts may be poor.\nDefault: 24 (llama.cpp's own).\nFlag: --spec-ngram-mod-n-match"
min-draft = "Min draft"
min-draft-hint = "The fewest tokens a draft must have to be proposed, 0 to 1024.\nDefault: 48 (llama.cpp's own).\nFlag: --spec-ngram-mod-n-min"
max-draft = "Max draft"
max-draft-hint = "The most tokens drafted per step, 0 to 1024.\nDefault: 64 (llama.cpp's own).\nFlag: --spec-ngram-mod-n-max"
lookup-n-gram = "Lookup n-gram"
ngram-simple-lookup-hint = "How many recent tokens are looked up in the context (the n-gram), 1 to 1024.\nDefault: 12 (llama.cpp's own).\nFlag: --spec-ngram-simple-size-n"
draft-m-gram = "Draft m-gram"
ngram-simple-draft-hint = "How many tokens are drafted after a match (the m-gram), 1 to 1024.\nDefault: 48 (llama.cpp's own).\nFlag: --spec-ngram-simple-size-m"
ngram-map-lookup-hint = "How many recent tokens are looked up in the context (the n-gram), 1 to 1024.\nDefault: 12 (llama.cpp's own).\nFlag: --spec-ngram-map-k-size-n"
ngram-map-draft-hint = "How many tokens are drafted after a match (the m-gram), 1 to 1024.\nDefault: 48 (llama.cpp's own).\nFlag: --spec-ngram-map-k-size-m"
ngram-map-values-lookup-hint = "How many recent tokens are looked up in the context (the n-gram), 1 to 1024.\nDefault: 12 (llama.cpp's own).\nFlag: --spec-ngram-map-k4v-size-n"
ngram-map-values-draft-hint = "How many tokens are drafted after a match (the m-gram), 1 to 1024.\nDefault: 48 (llama.cpp's own).\nFlag: --spec-ngram-map-k4v-size-m"
min-hits = "Min hits"
min-hits-hint = "How many times an n-gram must have been seen before what follows it is proposed. Higher drafts less often but more reliably.\nDefault: 1 (llama.cpp's own).\nFlag: --spec-ngram-map-k4v-min-hits"
save-preset = "Save preset"
server-intro = "llama-server settings shared by every model (server.ini). Per-model settings are under Models."
network = "Network"
port = "Port"
port-hint = "The network port llama-server listens on. The chat UI and integrations connect here.\nDefault: 9931 (llama.cpp's own).\nFlag: --port"
bind-to = "Bind to"
bind-to-hint = "Which addresses llama-server listens on. Check one or more.\nlocalhost = this machine only.\n0.0.0.0 = every interface, reachable from your network. It covers all the other rows, so checking it clears them.\nThe chat UI and integrations connect to a loopback address when one is checked, otherwise to the first one.\nFlag: --host"
base-url = "Base URL"
base-url-hint = "The address integrations use (opencode.json and Claude Code).\nDefault: built from host and port, with /v1 added for opencode.json. Untick default to enter your own, for a proxy or gateway."
api-key = "API key"
api-key-hint = "The key integrations send. Needed only behind a proxy or LLM gateway that requires one.\nNo key = none."
no-key = "No key"
resources = "Resources"
cpu-threads = "CPU threads"
cpu-threads-hint = "How many CPU threads generate tokens. More won't help once the GPU is the limit.\nDefault: llama.cpp uses the physical core count. Maximum = logical processors.\nFlag: --threads"
batch-threads = "Batch threads"
batch-threads-hint = "How many CPU threads read the prompt (prefill).\nDefault: the same as CPU threads. Maximum = logical processors.\nFlag: --threads-batch"
max-models = "Max models"
max-models-hint = "How many models can stay loaded at once. 1 = one at a time, lowest VRAM; higher switches between models without reloading. 0 = no limit.\nDefault: 4 (llama.cpp's own).\nFlag: --models-max"
memory-margin = "Memory margin"
memory-margin-hint = "Memory kept free on every GPU, in MiB. Before loading a model, llama-server unloads the least recently used ones until the new one fits, on top of Max models.\nDefault: 0, off (llama.cpp's own): only Max models limits what stays loaded.\nFlag: --models-memory-margin"
models-folder = "Models folder"
models-folder-hint = "The folder holding your models. The pickers read its subfolders: models, mmprojs, mtps and dflashs."
models-folder-placeholder = "root folder (models and mmprojs underneath)"
web-ui = "Web UI"
web-ui-hint = "Serves the built-in chat page at /. With it off, the API, the Integrations tab and the benchmark keep working; Open chat UI is disabled while the running server has no UI.\nDefault: on (llama.cpp's own).\nFlag: --no-ui"
serve-chat-ui = "serve the built-in chat UI"
web-ui-mcp-proxy = "Web UI MCP proxy"
web-ui-mcp-proxy-hint = "Lets the built-in chat page reach MCP servers through llama-server, for those a browser cannot call directly. Each MCP server opts in with Use llama-server proxy in the chat page.\nAnyone who can reach this server can then make it fetch any web address. Experimental in llama.cpp: keep it off on a network you do not trust.\nNot passed while Web UI is off; your choice is kept.\nDefault: off (llama.cpp's own).\nFlag: --webui-mcp-proxy"
webui-mcp-toggle = "serve the web UI's MCP proxy endpoint"
log-level = "Log level"
log-level-hint = "How much llama-server writes to its log. Each level includes the ones below it: OUTPUT:0 writes almost nothing, DEBUG:5 everything.\nDefault: TRACE:4, which records each request in logs/llama-server.log. DEBUG:5 also logs the per-tensor lines tools\\report-memory.ps1 reads.\nFlag: --log-verbosity"
conversation-snapshots = "Conversation snapshots"
snapshots-intro = "Saves each loaded model's KV cache (its memory of the conversation) to disk when the server stops, and restores the newest one on the next start, so a restart need not read the whole conversation again. On a long prompt that takes far longer than reading the snapshot back. Off by default: a snapshot uses as much disk as the KV cache it holds, stopping waits for the write, and the next start loads the model right away to restore it."
save-on-shutdown = "Save on shutdown"
save-on-shutdown-hint = "Saves the conversation to the snapshot folder when llama-server stops, and restores it at the next start. Worth it for long agent sessions, pointless for short prompts.\nOne file per loaded model, overwritten each time; files of models no longer loaded are removed.\nDefault: off.\nFlag: --slot-save-path"
snapshot-toggle = "snapshot the KV cache on stop and restore it on start"
snapshot-folder = "Snapshot folder"
snapshot-folder-hint = "Where snapshots go. A snapshot is about the size of the KV cache in use: it grows with the tokens actually in the conversation, NOT with Context size (a model's guide gives its size per token). Expect more on a hybrid model or with a drafter.\nThe default is in your user data folder, on the system drive: point it at a data disk if that is tight.\nThe folder is created at launch: llama.cpp refuses to start without it.\nFlag: --slot-save-path"
snapshot-folder-placeholder = "folder for the snapshots"
sdk-tuning = "SDK tuning"
sdk-tuning-intro = "Settings of the GPU vendor's own libraries, passed to llama-server as environment variables at launch. They are not llama.cpp flags: nothing checks their values, and each one only affects its own backend. The Command line card below shows exactly what is set."
cuda-nothing-to-tune = "Nothing to tune: the CUDA builds this framework ships need no workaround here."
hipblaslt-hint = "Chooses which of its two libraries ROCm uses for heavy matrix work. Leave it at default unless BF16 or F16 models crash.\nSet it off on a Radeon AI PRO R9700 (gfx1201) when every BF16/F16 model aborts on its first prefill batch. That happens only with the graphics driver's HIP runtime, which a Windows build from source uses; the installer puts ROCm's own runtime beside llama-server, so an installed framework should not need this.\ndefault = don't set the variable: rocBLAS chooses (hipBLASLt for 16-bit work on RDNA4).\non = hipBLASLt; off = Tensile.\nNo effect on CUDA or Vulkan builds.\nVariable: ROCBLAS_USE_HIPBLASLT"
profiler-attach = "Profiler attach"
profiler-attach-hint = "Lets ROCm's profiler (rocprofv3 --attach <pid>, in the TheRock dist) attach to the running llama-server. Only for profiling; without it the attach is refused.\nUnchecked = don't set the variable.\nNo effect on CUDA or Vulkan builds.\nVariable: ROCP_TOOL_ATTACH=1"
profiler-attach-toggle = "allow rocprofv3 --attach"
cuda-and-rocm = "CUDA and ROCm"
tensor-split-allreduce = "Tensor-split AllReduce"
tensor-split-allreduce-hint = "How the GPUs combine their results under split mode tensor. Applies to the whole server, CUDA and ROCm alike; no effect in other split modes.\nLeave it at default, except for a tensor split that MIXES a CUDA and a ROCm GPU: that needs none, or the model aborts while loading. Prefill then falls well behind the layer split, with the same decode (the Radeon AI PRO R9700 guide has the figures).\ndefault = don't set the variable: on Linux the collective library when the build links one (RCCL for ROCm), then the internal method; on Windows the internal one.\nnccl = the collective library (RCCL on ROCm; NCCL on CUDA where the build found it).\ninternal = ggml's own method, through pinned host memory, so the slower card's PCIe link limits it.\nnone = the generic method of llama.cpp's meta backend.\nVariable: GGML_CUDA_ALLREDUCE"
disable-gpu-graphs = "Disable GPU graphs"
disable-gpu-graphs-hint = "A troubleshooting switch: launches the GPU work of each generation step one kernel at a time instead of replaying a recorded graph. Generation gets slower. Try it when generation crashes or produces garbage while prefill is fine.\nUnchecked = don't set the variable.\nNo effect on Vulkan builds.\nVariable: GGML_CUDA_DISABLE_GRAPHS=1"
disable-gpu-graphs-toggle = "launch kernels one by one"
kv-rotation = "KV rotation"
kv-rotation-hint = "Turns off a step (a Hadamard rotation) that keeps a quantized KV cache, such as q8_0 or q4_0, close to f16 quality. Turn it off only to compare quality or speed, or on a backend where it misbehaves; the load logs a warning.\nNo effect with an f16 or bf16 cache, or a head size that is not a multiple of 64. The DeepSeek-3.2/4, GLM-DSA and dots3note indexers rotate regardless.\nUnchecked = rotation on (variable not set).\nVariable: LLAMA_ATTN_ROT_DISABLE=1"
