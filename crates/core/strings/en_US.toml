only-above = "Only above"
only-above-hint = "Files the log only if it is larger than this many KB. A smaller one stays and the next run appends to it, so short runs share one file instead of leaving one each.\n0 = file every non-empty log.\nDefault: 1024. Applies on Enter or when the field loses focus."
