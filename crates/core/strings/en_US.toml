# The configurator's user-visible text, in one language: the file's name.
# Read once at startup from <install>/share/strings/, or from here in a tree build,
# so a text changes by editing its value here, with no rebuild.
#
# The keys are identifiers, used as Strings.t("key") in ui/*.slint and strings::t("key") in src/, and name a role, not a text:
# lowercase words and hyphens, no number, size, version or file name, one key per distinct text.
# A key with no entry here shows on screen as itself; a test fails on a missing or an unused key.
# Only language lives here: numbers, units, acronyms (t/s, sd, GQA), paths and format examples stay
# in the code, and an acronym inside a text stays in English in every language.
# A value in a sentence is {0}, {1} (Strings.t1, t2, strings::fill), so a translation can put it anywhere.
# Every value is a one-line basic string: a line break is \n, a backslash \\, a quote \".

benchmark = "Benchmark"
benchmark-intro = "Measure one preset, or compare several. You compare presets, not model files: two presets over the same .gguf are a valid comparison, and usually the most useful one."
engine = "Engine"
mode = "Mode"
mode-hint = "How to measure.\nlive: sends real requests to the running llama-server, with your prompts and temperature. It measures what the preset really does, drafter and chat template included. Needs llama-server running.\nsynthetic: runs llama-bench over token counts. No prompt and no sampling, so it repeats exactly, but it cannot load the preset's drafter and ignores the mmproj, the chat template and the reasoning settings. Needs llama-server stopped: Run stops it for you, and it stays stopped afterwards."
presets = "Presets"
no-presets = "No presets found. Create one under the Models tab first."
workload = "Workload"
prompts = "Prompts"
prompts-hint = "The texts the benchmark sends. Each ticked file runs in turn, into one campaign, and is sent whole on every repetition with the prompt cache off, so every repetition measures a cold prefill (the model reading the prompt from nothing).\nA .txt is one user message; a .json is a whole conversation, tools included, like a coding agent's request.\nThe shipped prompts are read-only, pinned by the standard spec: 43k (the default), 110k (deep context), code (a coding-agent turn with tools), code-write (the same task, writing code) and image (a photograph to describe; runs only on presets with an mmproj, see the Image row).\nThe ranking of settings can change with context length, so prefer the prompt closest to how you work.\n+ Browse… adds a file of your own: a custom run, or a derived one under a spec. Files are re-read when Run starts; Edit opens one in your default editor (to change a shipped one, edit a copy).\nThe first ticked file is also what `bench run` uses without --prompt-file."
edit = "Edit"
remove = "Remove"
add-file = "+ Browse…"
temperature = "Temperature"
temperature-hint = "Sets the sampling temperature for this run, in place of the preset's. 0 always picks the likeliest token, which makes two runs of the same prompt comparable. Tick default to keep the preset's value and accept the variation between runs.\nFlag: --temp"
max-output-tokens = "Max output tokens"
max-output-tokens-hint = "The longest answer each request may generate. Long enough for the speed to settle, short enough that a slow model does not turn one repetition into minutes.\n0 = no limit: the model stops on its own or at the preset's Max output, so the answer's length becomes part of the result.\nRequest field: max_tokens"
image = "Image"
image-hint = "The picture an image prompt sends. An image prompt holds a picture, like the shipped bench-prompt-image-1.0.json, and runs only on presets that load an mmproj.\nBy default each image prompt sends its own; this row shows the first ticked one's (with none ticked, the shipped prompt's, which the standard spec sends).\nChoose… sends a JPEG or PNG of yours instead, for every image prompt, fitted into Image size. Under a spec that counts as an Override: the runs are recorded as custom, derived from the spec.\nPrompt's goes back to the prompts' own."
choose = "Choose…"
use-prompt-image = "Prompt's"
image-size = "Image size"
image-size-hint = "The largest size a picture is sent at, as WxH. It keeps its proportions, is never enlarged and is re-encoded as JPEG, so every model reads the same image whatever the file's size.\noriginal = send the file as is.\nIgnored by prompts without an image. An image prompt runs only on presets that load an mmproj."
concurrency = "Concurrency"
concurrency-hint = "How many requests run at once.\nsingle: one request per repetition.\nThe next three send one request per slot of the preset, all at once, each on its own slot. The number of slots is the preset's Parallel slots (4 when unset; it must be at least 2).\nprefill: all slots read the whole prompt, then generate together.\ndecode: every slot has read the prompt first, so all of them only generate.\nprefill+decode: all slots but one generate while the last one reads the prompt.\nThe results add prefill total and decode total, the combined speed of all the requests.\nall: each of the four in turn, into one campaign (single alone if a selected preset has fewer than 2 slots).\nCLI: bench run --concurrency"
prompt-lengths = "Prompt lengths"
prompt-lengths-hint = "How many tokens of prompt each test reads, comma separated. These are counts, not text: this engine never reads a prompt of yours and never samples. Each length is one row of results.\nllama-bench flag: -p"
generate = "Generate"
generate-hint = "How many tokens each generation test produces.\nllama-bench flag: -n"
depths = "Depths"
depths-hint = "How many tokens already fill the KV cache (the model's memory of the conversation) before each generation test, comma separated. Generation slows down as it fills, so a single depth of 0 shows only the best case.\nllama-bench flag: -d"
repetitions = "Repetitions"
repetitions-hint = "How many times each test runs. The results show the average and the spread (sample standard deviation); the spread tells you whether a difference between two presets is real."
campaign = "Campaign"
spec = "Spec"
spec-hint = "The test method.\ncustom: runs the Workload fields above as you set them.\nstandard-<X.Y>: runs that published version of the framework's method, so results from different machines can be compared. It fixes the prompts, temperature, output cap, concurrency and repetitions, so those fields are greyed out. Every version stays runnable. Live mode only.\nLoad… opens a spec file of yours; Save as… writes the current setup as one. A spec of yours runs the same way, is recorded as custom, derived from it, and cannot be named standard.\nA step of a spec can change a preset setting (the engine step of standard turns the drafter off): it is written to the selected presets for that step, with llama-server restarted around it, and put back afterwards."
load = "Load…"
save-as = "Save as…"
spec-override-hint = "Unlocks the Workload fields. Each one you change after ticking this replaces the spec's value in every step (a prompt replaces the prompt list, a concurrency the spec's scenarios); the rest stays as the spec says. The runs no longer count as the spec: they are recorded as custom, derived from it, with what changed."
spec-override = "Override (custom, derived from the spec)"
name = "Name"
campaign-name-hint = "The campaign in the database this run is saved under. An existing name adds to that campaign.\nEmpty = a new campaign named after the run's date and time (and the spec's name and version on a spec run).\nCLI: --campaign"
question = "Question"
question-hint = "What this campaign is meant to find out. It is saved with the campaign, and it is what `bench answer` later answers.\nCLI: --question"
ab-key = "A/B key"
ab-key-hint = "Compares several values of one preset setting. Every step of the run (each prompt, scenario and spec step) runs once per value: the value is written to the selected presets, llama-server restarts around it, and the setting is put back afterwards.\nThe list holds the settings that change how the model is launched (placement, KV cache, batch sizes, drafters...). none = no comparison.\nUnder a spec, a setting the spec does not touch keeps the runs as spec runs; one it sets itself (spec-type under standard) records them as custom, derived from the spec.\nCLI: bench run --key"
values = "Values"
values-hint = "The values to compare, separated by commas. A range is written 2..8, and `unset` removes the setting for one run. If a value holds commas (tensor-split, device), separate with ; and end a single such value with ;. They are checked against the presets before Run starts.\nCLI: bench run --values"
preview = "Preview"
preview-intro = "Exactly what Run will do, built by the same code that runs it."
cancel = "Cancel"
results = "Results"
no-results = "Nothing measured yet. Results appear here as each test completes. Each preset is saved once it has been measured to the end, so a run that dies keeps the presets already finished."
test = "Test"
preset = "Preset"
saved-runs = "Saved runs"
database = "Database"
database-hint = "The database file every finished run is saved to, and the one listed below. Empty = bench/bench.db in your data folder.\nTo record straight into a clone's database, with no bench publish, point it at that clone's benchmarks/bench.db. Either way, absolute paths are cut to file names and secret-like values are dropped.\nA missing file is created by the first finished run. Enter, Browse… or Run saves the path to settings.ini (BenchDb), and the bench run and bench query commands use it too."
browse = "Browse…"
run = "Run"
run-hint = "Every run is saved as a campaign in the database above. A preset is saved once it has been measured to the end, with its settings, every repetition and the engine's output; a preset that fails or is cancelled is not saved. Pick a campaign here to reload its table. Campaigns from `bench run` are listed too, one column per value."
