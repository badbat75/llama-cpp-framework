[package]
name = "pai-app"
version.workspace = true
edition = "2021"
build = "build.rs"
description = "The configurator's logic without a GUI, shared by the GUI and the CLI of the Private AI Framework"
license = "MIT"
publish = false

# Its doc comments are not doctests: none was written as one.
[lib]
path = "src/lib.rs"
doctest = false

# `test-support`: the test doubles pai-config's tests use (`server_control::fake`
# and the fake backend a test build picks, the journal readers that read
# nothing). pai-config's dev-dependency turns it on; no shipped build has it.
[features]
test-support = []

[dependencies]
# The modules shared with pai-manager (paths, INI, server config, the
# launch, strings).
pai-core = { path = "../core" }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
# The Tensor placement picker reads which tensors a rule's regex matches
# (tensor_picker.rs). Already in the lock as a transitive dependency.
regex = "1.13"
# bench.db (bench/db.rs): the benchmark store, one schema shared with the
# repo's benchmarks/. `bundled` compiles SQLite in, so Windows needs no DLL.
rusqlite = { version = "0.41", features = ["bundled"] }
# Image prompts (bench::resolve_images): the image a prompt names is decoded,
# fitted into the run's image size and re-encoded as JPEG at send time.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.23"
# `bench run` puts the preset back when interrupted (bench/interrupt.rs).
# `termination` adds SIGTERM and SIGHUP to Ctrl-C.
ctrlc = { version = "3.5", features = ["termination"] }

# The Win32 calls of these modules (registry, HW Monitor, the GGUF library
# loader, uptime), with the signatures and constants Microsoft's metadata
# declares instead of hand-written ones. 0.61 is the version slint's winit
# compiles in pai-config. Each module is a feature: a new call may need one
# more.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
pai-core = { path = "../core", features = ["test-support"] }
tempfile = "3"
