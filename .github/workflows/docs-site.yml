# Builds the docs site (tools/site, docs/AGENTS.md) from docs/ and
# benchmarks/bench.db and publishes it on GitHub Pages. The build runs the
# same checks as `cargo run -p docs-site -- --check`: a broken citation or
# chart fails it and the published site stays as it was.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "benchmarks/bench.db"
      - "tools/site/**"
      - "Cargo.lock"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build the site
        run: cargo run --locked -p docs-site -- --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
